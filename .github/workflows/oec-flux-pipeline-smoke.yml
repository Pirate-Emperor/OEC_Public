name: OEC FLUX to TRELLIS A100 inference acceptance

on:
  push:
    branches:
      - feat/media-service-sidecars-20261018
      - fix/media-stack-supervision-20261019
    paths:
      - "pipeline_flux_image.py"
      - "oec_gpu_admission.py"
      - "pipeline_flux_trellis.py"
      - "pipeline_trellis_3d.py"
      - "tools/run_flux_pipeline_smoke.py"
      - "pipeline_flux_trellis.py"
      - "pipeline_trellis_3d.py"
      - "tools/prepare_flux_cache.py"
      - "tools/cleanup_test_model_caches.py"
      - "asset_factory/**"
      - "brain_config.json"
      - "brain.py"
      - "tests/test_flux_image_pipeline.py"
      - "tests/test_flux_trellis_pipeline.py"
      - "tests/test_asset_factory_upload_queue.py"
      - "tests/test_ltx_sidecar_cache_policy.py"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oec-media-gpu-storage-serial
  cancel-in-progress: false

jobs:
  flux-trellis-inference:
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-1]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout OEC feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate assigned A100 runner, existing environment and storage configuration
        id: preflight
        run: |
          set -euo pipefail
          ACCOUNT_HOME="$(getent passwd "$(id -un)" | cut -d: -f6 || true)"
          if [[ -z "$ACCOUNT_HOME" ]]; then ACCOUNT_HOME="$HOME"; fi
          HOST_SHORT="$(hostname -s)"
          printf 'RUNNER=%s\nHOST=%s\nUSER=%s\nHOME=%s\nACCOUNT_HOME=%s\n' "$RUNNER_NAME" "$HOST_SHORT" "$(id -un)" "$HOME" "$ACCOUNT_HOME"
          test "$RUNNER_NAME" = "oec-1" || { echo "::error::Expected oec-train, got $RUNNER_NAME"; exit 2; }
          test "$HOST_SHORT" = "scn30-mn" || { echo "::error::Expected shared-storage lock owner scn30-mn, got $HOST_SHORT"; exit 2; }
          CONDA_EXE=""
          for candidate in "$HOME/Conda/condabin/conda" "$ACCOUNT_HOME/Conda/condabin/conda"; do
            if [[ -x "$candidate" ]]; then CONDA_EXE="$candidate"; break; fi
          done
          test -n "$CONDA_EXE" && test -x "$CONDA_EXE" || { echo "::error::Existing Conda executable not found; no environment changes permitted."; exit 2; }
          STORAGE_CONFIG=""
          for candidate in "$HOME/OEC/storage_config.json" "$ACCOUNT_HOME/OEC/storage_config.json"; do
            if [[ -f "$candidate" && ! -L "$candidate" ]]; then STORAGE_CONFIG="$candidate"; break; fi
          done
          test -n "$STORAGE_CONFIG" || { echo "::error::Trusted host StorageManager config missing; inference denied."; exit 2; }
          install -m 600 "$STORAGE_CONFIG" "$GITHUB_WORKSPACE/storage_config.json"
          echo "CONDA_EXE=$CONDA_EXE" >> "$GITHUB_ENV"
          echo "OEC_ACCOUNT_HOME=$ACCOUNT_HOME" >> "$GITHUB_ENV"
          RECOVERY_DIR="$RUNNER_TEMP/oec-flux-pipeline-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/preflight-recovery"
          mkdir -p "$RECOVERY_DIR"
          timeout --signal=INT --kill-after=5s 120s "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/run_media_model_smokes.py \
            --providers kokoro,whisper,qwen3-asr,ace-step --cleanup-owned-services --recover-orphan-services \
            --log-dir "$RECOVERY_DIR" 2>&1 | tee "$RECOVERY_DIR/owner-recovery.log"
          timeout --signal=INT --kill-after=5s 35s "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/recover_dead_storage_locks.py models 2>&1 | tee "$RECOVERY_DIR/models-lock-recovery.log"
          timeout --signal=INT --kill-after=5s 35s "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/recover_dead_storage_locks.py outputs 2>&1 | tee "$RECOVERY_DIR/outputs-lock-recovery.log"
          timeout --signal=INT --kill-after=5s 60s "$CONDA_EXE" run --no-capture-output -n phase2_3d python -c 'import sys, torch, diffusers, huggingface_hub, transformers; print("ENV=phase2_3d"); print("PYTHON="+sys.version.split()[0]); print("TORCH="+torch.__version__); print("CUDA="+str(torch.version.cuda)); print("DIFFUSERS="+diffusers.__version__); print("HUGGINGFACE_HUB="+huggingface_hub.__version__); print("TRANSFORMERS="+transformers.__version__); assert torch.cuda.is_available()'
          nvidia-smi
          echo "GPU_PROCESS_OWNERSHIP_SNAPSHOT_BEGIN"
          while IFS=, read -r pid used_memory; do
            pid="$(printf '%s' "$pid" | tr -d '[:space:]')"
            used_memory="$(printf '%s' "$used_memory" | tr -d '[:space:]')"
            [[ "$pid" =~ ^[0-9]+$ ]] || continue
            printf 'GPU_PID=%s GPU_MEMORY=%s\n' "$pid" "$used_memory"
            ps -o user=,pid=,ppid=,etime=,stat=,comm= -p "$pid" || true
          done < <(nvidia-smi --query-compute-apps=pid,used_memory --format=csv,noheader 2>/dev/null || true)
          echo "GPU_PROCESS_OWNERSHIP_SNAPSHOT_END"
      - name: Compile sources and run offline contract tests
        run: |
          set -euo pipefail
          CONDA="$CONDA_EXE"
          "$CONDA" run --no-capture-output -n phase2_3d python -m py_compile \
            pipeline_flux_image.py pipeline_flux_trellis.py pipeline_trellis_3d.py \
            brain.py core_config.py storage_policy.py storage_manager.py tools/oec_service_manager.py \
            asset_factory/__init__.py asset_factory/registry.py asset_factory/client.py asset_factory/worker.py \
            tools/media_services/common.py tools/media_services/model_cache.py \
            tools/media_services/audio_api.py tools/media_services/audiocraft_api.py \
            tools/media_services/flux_api.py tools/media_services/trellis_api.py tools/media_services/ltx_api.py \
            tools/run_flux_pipeline_smoke.py tests/test_flux_image_pipeline.py tests/test_flux_trellis_pipeline.py \
            tests/test_asset_factory_upload_queue.py tests/test_ltx_sidecar_cache_policy.py \
            tests/test_oec_service_manager_media.py
          "$CONDA" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_flux_image_pipeline.py' -v
          "$CONDA" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_flux_trellis_pipeline.py' -v
          "$CONDA" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_asset_factory_upload_queue.py' -v
          "$CONDA" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_ltx_sidecar_cache_policy.py' -v
          "$CONDA" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_oec_service_manager_media.py' -v

      - name: Capture live StorageManager state before inference
        run: |
          set -euo pipefail
          REPORT_DIR="$RUNNER_TEMP/oec-flux-pipeline-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$REPORT_DIR"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$REPORT_DIR/storage-before.log"

      - name: Generate a PNG with FLUX and pass the exact file to TRELLIS
        run: |
          set -euo pipefail
          REPORT_DIR="$RUNNER_TEMP/oec-flux-pipeline-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          WORK_DIR="/tmp/oec-flux-pipeline-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$REPORT_DIR"
          timeout --signal=INT --kill-after=15s 1500s "$CONDA_EXE" run --no-capture-output -n phase2_3d \
            python tools/run_flux_pipeline_smoke.py \
            --work-dir "$WORK_DIR" --report-dir "$REPORT_DIR" --width 512 --height 512 --steps 4 --allow-download

      - name: Stop any managed TRELLIS service and purge named model caches
        if: always()
        run: |
          set +e
          CONDA="${CONDA_EXE:-}"
          ACCOUNT_HOME="$(getent passwd "$(id -un)" | cut -d: -f6 2>/dev/null || true)"
          if [[ -z "$ACCOUNT_HOME" ]]; then ACCOUNT_HOME="$HOME"; fi
          if [[ -z "$CONDA" ]]; then
            for candidate in "$HOME/Conda/condabin/conda" "$ACCOUNT_HOME/Conda/condabin/conda"; do
              if [[ -x "$candidate" ]]; then CONDA="$candidate"; break; fi
            done
          fi
          REPORT_DIR="$RUNNER_TEMP/oec-flux-pipeline-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          PREFLIGHT_OUTCOME="${{ steps.preflight.outcome }}"
          mkdir -p "$REPORT_DIR"
          if [[ -z "$CONDA" || ! -x "$CONDA" ]]; then
            echo "CLEANUP_BLOCKED: trusted Conda executable unavailable; leaving model caches and locks untouched" | tee "$REPORT_DIR/cleanup-blocked.log"
            exit 0
          fi
          timeout --signal=INT --kill-after=10s 45s "$CONDA" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py stop trellis-api --grace-seconds 25 >"$REPORT_DIR/trellis-service-stop.log" 2>&1
          stop_rc=${PIPESTATUS[0]}
          cat "$REPORT_DIR/trellis-service-stop.log"
          echo "TRELLIS_SERVICE_STOP_RC=$stop_rc" | tee -a "$REPORT_DIR/trellis-service-stop.log"
          timeout --signal=INT --kill-after=3s 12s "$CONDA" run --no-capture-output -n phase2_3d python -c 'import socket,sys; s=socket.socket(); s.settimeout(1); rc=s.connect_ex(("127.0.0.1",7868)); s.close(); print(f"TRELLIS_PORT_7868_FREE={rc != 0}"); sys.exit(0 if rc != 0 else 1)'
          port_rc=$?
          if [[ "$port_rc" -ne 0 ]]; then echo "CLEANUP_BLOCKED: TRELLIS port owner remains or could not be verified; preserving caches"; exit 1; fi
          if [[ "$PREFLIGHT_OUTCOME" != "success" ]]; then
            echo "CACHE_PURGE_SKIPPED reason=preflight_failed inference_not_started=true caches_preserved=true"
            exit 0
          fi
          for model in trellis-2-4b flux-klein-4b; do
            unlocked=false
            for attempt in $(seq 1 12); do
              probe_out="$REPORT_DIR/$model-lock-probe.out"
              timeout --signal=INT --kill-after=2s 12s "$CONDA" run --no-capture-output -n phase2_3d python -c "from tools.media_services.model_cache import read_lock; lock=read_lock('$model'); print(lock.get('state', 'unknown') if lock else 'unlocked')" >"$probe_out" 2>"$REPORT_DIR/$model-lock-probe.err"
              lock_rc=$?
              lock_state="$(tail -n 1 "$probe_out" | tr -d '\r')"
              if [[ "$lock_rc" -ne 0 ]]; then echo "::error::LOCK_PROBE_FAILED model=$model rc=$lock_rc; preserving caches"; cat "$REPORT_DIR/$model-lock-probe.err"; tail -n 10 "$probe_out"; exit 1; fi
              if [[ ! "$lock_state" =~ ^(unlocked|stale|active|remote-or-unknown|unknown)$ ]]; then echo "::error::LOCK_PROBE_UNPARSEABLE model=$model state=$lock_state; preserving caches"; tail -n 10 "$probe_out"; exit 1; fi
              echo "MODEL_CACHE_LOCK model=$model state=$lock_state"
              if [[ "$lock_state" == "unlocked" || "$lock_state" == "stale" ]]; then unlocked=true; break; fi
              sleep 5
            done
            if [[ "$unlocked" != "true" ]]; then echo "::error::MODEL_CACHE_LOCK_WAIT_TIMEOUT model=$model; preserving named cache"; exit 1; fi
          done
          set -e
          "$CONDA" run --no-capture-output -n phase2_3d python tools/cleanup_test_model_caches.py \
            --models flux-klein-4b,trellis-2-4b --report-json "$REPORT_DIR/cache-cleanup.json" 2>&1 | tee "$REPORT_DIR/cache-cleanup.log"
          "$CONDA" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$REPORT_DIR/storage-after-cleanup.log"
      - name: Capture final StorageManager state
        if: always()
        run: |
          set +e
          REPORT_DIR="$RUNNER_TEMP/oec-flux-pipeline-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$REPORT_DIR"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$REPORT_DIR/storage-after.log"
          exit 0

      - name: Upload current-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oec-flux-pipeline-smoke
          path: ${{ runner.temp }}/oec-flux-pipeline-smoke-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 3
