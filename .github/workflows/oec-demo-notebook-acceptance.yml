          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-before.log"
          timeout --signal=INT --kill-after=30s 1800s "$CONDA_EXE" run --no-capture-output -n phase2_3d \
            python tools/prepare_flux_cache.py --allow-download 2>&1 | tee "$R/flux-cache-preparation.log"

      - name: Start the FLUX model server on an admitted idle A100
