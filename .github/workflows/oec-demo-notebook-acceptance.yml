name: OEC targeted model notebook acceptance
run-name: "AudioGen, ACE-Step and FLUX notebook acceptance"

on:
  push:
    branches:
      - fix/media-stack-supervision-20261019
    paths:
      - "pipeline_audiocraft.ipynb"
      - "pipeline_audiogen_gradio.ipynb"
      - "pipeline_acestep_gradio.ipynb"
      - "pipeline_flux_only.ipynb"
      - "pipeline_musicgen_gradio.ipynb"
      - "pipeline_trellis_3d.ipynb"
      - "pipeline_trellis_3d_only.ipynb"
      - "pipeline_ltx_video.ipynb"
      - "pipeline_wan_video.ipynb"
      - "Untitled.ipynb"
      - "pipeline_demo_acceptance.ipynb"
      - "phase1_test_compute_node.ipynb"
      - "oec_deply_install.ipynb"
      - "phase1_test_compute_node.ipynb"
      - "pipeline_audiogen.py"
      - "pipeline_flux_image.py"
      - "tools/run_audiogen_notebook_smoke.py"
      - "tools/run_gradio_model_notebook_smokes.py"
      - "tools/run_media_model_smokes.py"
      - "tools/audit_notebook_suite.py"
      - "tools/run_wan_notebook_smoke.py"
      - "tools/media_services/model_cache.py"
      - "tools/media_services/trellis_api.py"
      - "tools/media_services/ltx_api.py"
      - "tools/prepare_media_models.py"
      - "tools/prepare_ace_step_runtime.py"
      - "tools/prepare_flux_cache.py"
      - "tools/cleanup_test_model_caches.py"
      - "tools/run_safe_notebook_smokes.py"
      - "tools/media_services/audio_api.py"
      - "tools/media_services/audiocraft_api.py"
      - "tools/media_services/flux_api.py"
      - "tools/oec_service_manager.py"
      - "tests/test_audiocraft_notebook_static.py"
      - "tests/test_gradio_model_notebooks.py"
      - "tests/test_audio_service_validation.py"
      - "tests/test_flux_image_pipeline.py"
      - "tests/test_oec_service_manager_media.py"
      - "tests/test_media_smoke_process_cleanup.py"
      - "tests/test_prepare_flux_cache.py"
      - "tests/test_storage_write_admission.py"
      - "tests/test_trellis_notebook_static.py"
      - ".github/workflows/oec-demo-notebook-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oec-media-gpu-storage-serial
  cancel-in-progress: false

jobs:
  acceptance:
    name: Run full notebooks and real model-server Gradio callbacks
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-2]
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate assigned runner and load live StorageManager configuration
        id: preflight
        run: |
          set -euo pipefail
          CONDA_EXE="$HOME/Conda/condabin/conda"
          OEC_ACCEPTANCE_ROOT="$RUNNER_TEMP/oec-demo-notebook-acceptance-$GITHUB_RUN_ID"
          echo "CONDA_EXE=$CONDA_EXE" >> "$GITHUB_ENV"
          echo "OEC_ACCEPTANCE_ROOT=$OEC_ACCEPTANCE_ROOT" >> "$GITHUB_ENV"
          test "$RUNNER_NAME" = "oec-2"
          test -x "$CONDA_EXE"
          test -f "$HOME/OEC/storage_config.json"
          install -m 600 "$HOME/OEC/storage_config.json" "$GITHUB_WORKSPACE/storage_config.json"
          mkdir -p "$OEC_ACCEPTANCE_ROOT"
          printf 'RUNNER=%s\nHOST=%s\nCOMMIT=%s\n' "$RUNNER_NAME" "$(hostname)" "$GITHUB_SHA" | tee "$OEC_ACCEPTANCE_ROOT/runner.txt"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$OEC_ACCEPTANCE_ROOT/storage-before.log"
          nvidia-smi | tee "$OEC_ACCEPTANCE_ROOT/nvidia-smi-before.txt"

      - name: Compile code and run static contracts in each intended environment
        id: contracts
        continue-on-error: true
        run: |
          set -euo pipefail
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/audit_notebook_suite.py \
            --strict-clean --report-json "$OEC_ACCEPTANCE_ROOT/notebook-audit.json"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m py_compile \
            tools/oec_service_manager.py tools/media_services/audio_api.py tools/media_services/audiocraft_api.py \
            tools/media_services/flux_api.py tools/media_services/trellis_api.py tools/media_services/ltx_api.py \
            tools/media_services/model_cache.py tools/prepare_flux_cache.py tools/cleanup_test_model_caches.py tools/run_safe_notebook_smokes.py tools/audit_notebook_suite.py \
            tools/run_wan_notebook_smoke.py tools/run_gradio_model_notebook_smokes.py tools/run_media_model_smokes.py \
            tests/test_gradio_model_notebooks.py tests/test_audio_service_validation.py tests/test_flux_image_pipeline.py \
            tests/test_oec_service_manager_media.py tests/test_media_smoke_process_cleanup.py tests/test_prepare_flux_cache.py \
            tests/test_storage_write_admission.py tests/test_trellis_notebook_static.py
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_gradio_model_notebooks.py' -v
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_audio_service_validation.py' -v
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_flux_image_pipeline.py' -v
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_oec_service_manager_media.py' -v
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_media_smoke_process_cleanup.py' -v
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_prepare_flux_cache.py' -v
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_storage_write_admission.py' -v
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_trellis_notebook_static.py' -v
          "$CONDA_EXE" run --no-capture-output -n phase1 python -m unittest discover -s tests -p 'test_audiocraft_notebook_static.py' -v

      - name: Execute safe control/preflight notebooks top-to-bottom
        id: safe_control_notebooks
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/control-notebooks"
          mkdir -p "$R"
          export OEC_SAFE_NOTEBOOK_SMOKE_DIR="$R"
          timeout --signal=INT --kill-after=20s 600s "$CONDA_EXE" run --no-capture-output -n phase1_ltx \
            python tools/run_safe_notebook_smokes.py 2>&1 | tee "$R/notebook-execution.log"

      - name: Execute AudioCraft notebook top-to-bottom and generate a WAV
        id: audiogen_full_notebook
        continue-on-error: true
        run: |
          set -euo pipefail
          OEC_AUDIOGEN_SMOKE_DIR="$OEC_ACCEPTANCE_ROOT/audiogen-full-notebook"
          mkdir -p "$OEC_AUDIOGEN_SMOKE_DIR"
          export OEC_AUDIOGEN_HEADLESS_SMOKE=1
          export OEC_AUDIOGEN_SMOKE_DIR
          export GRADIO_ANALYTICS_ENABLED="False"
          timeout --signal=INT --kill-after=20s 1800s "$CONDA_EXE" run --no-capture-output -n phase1 \
            python tools/run_audiogen_notebook_smoke.py 2>&1 | tee "$OEC_AUDIOGEN_SMOKE_DIR/notebook-execution.log"

      - name: Start the AudioGen server on an admitted idle A100
        id: audiogen_start
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/audiogen-gradio"
          mkdir -p "$R"
          GPU="$("$CONDA_EXE" run --no-capture-output -n phase2_3d python -c 'from oec_gpu_admission import select_idle_a100_gpu; print(select_idle_a100_gpu(caller="AUDIOGEN_NOTEBOOK_ACCEPTANCE")["index"])' | tail -n 1)"
          echo "AUDIOGEN_PHYSICAL_GPU=$GPU" | tee "$R/gpu.txt"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py start audiocraft-api \
            --provider audiogen --gpu "$GPU" --port 7874 --allow-download --accept-noncommercial-license 2>&1 | tee "$R/service-start.log"

      - name: Wait for AudioGen model server readiness
        id: audiogen_health
        if: always() && steps.audiogen_start.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/audiogen-gradio"
          HEALTH_CODE='import json, urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); health=json.load(opener.open("http://127.0.0.1:7874/health", timeout=3)); assert not health.get("error") or health.get("loading", False), "fatal model load error: " + str(health.get("error")); assert health.get("ready") and health.get("model_loaded"), health; print(json.dumps(health))'
          ready=0
          for _ in $(seq 1 240); do
            if "$HOME/Conda/envs/phase2_3d/bin/python" -c "$HEALTH_CODE" >"$R/health-check.log" 2>&1; then ready=1; break; fi
            sleep 5
          done
          cat "$R/health-check.log"
          test "$ready" -eq 1

      - name: Launch AudioGen Gradio UI and submit a real server inference
        id: audiogen_gradio
        if: always() && steps.audiogen_health.outcome == 'success'
        continue-on-error: true
        env:
          OEC_MEDIA_API_URL: "http://127.0.0.1:7874"
          OEC_GRADIO_HEADLESS_SMOKE: "1"
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/audiogen-gradio"
          mkdir -p "$R"
          timeout --signal=INT --kill-after=20s 1800s "$CONDA_EXE" run --no-capture-output -n phase1 \
            python tools/run_gradio_model_notebook_smokes.py --provider audiogen --report-dir "$R" 2>&1 | tee "$R/gradio-callback.log"

      - name: Stop the managed AudioGen service
        if: always()
        run: |
          set +e
          mkdir -p "$OEC_ACCEPTANCE_ROOT/audiogen-gradio"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py logs audiocraft-api --tail 100 >"$OEC_ACCEPTANCE_ROOT/audiogen-gradio/service-final.log" 2>&1
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py stop audiocraft-api --grace-seconds 25 >>"$OEC_ACCEPTANCE_ROOT/audiogen-gradio/service-final.log" 2>&1
          exit 0

      - name: Purge AudioGen cache after the service is stopped
        id: audiogen_purge
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/audiogen-gradio"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/cleanup_test_model_caches.py --models audiogen-medium --report-json "$R/cache-cleanup.json" 2>&1 | tee "$R/cache-cleanup.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/model_cache_manager.py status 2>&1 | tee -a "$OEC_ACCEPTANCE_ROOT/audiogen-gradio/cache-cleanup.log"

      - name: Test standalone MusicGen CLI mode and decode its WAV
        id: musicgen_cli
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/musicgen-cli"
          mkdir -p "$R"
          OUT="/tmp/oec-musicgen-acceptance-$GITHUB_RUN_ID.wav"
          timeout --signal=INT --kill-after=30s 1800s "$CONDA_EXE" run --no-capture-output -n phase1 \
            python pipeline_musicgen.py --mode generate --allow-download --scratch-output \
            --output "$OUT" --duration 3 --seed 42 \
            --prompt "A short calm instrumental cue, warm piano and mellow strings" 2>&1 | tee "$R/model-generation.log"
          "$CONDA_EXE" run --no-capture-output -n phase1 python -c 'import soundfile,sys; x=soundfile.info(sys.argv[1]); print("MUSICGEN_CLI_WAV=PASS",x); assert x.frames>0 and x.samplerate>0 and x.channels>0 and x.duration>0' "$OUT"
          cp "$OUT" "$R/musicgen-direct.wav"
          cp "$OUT.info.json" "$R/musicgen-direct.info.json"
          sha256sum "$R/musicgen-direct.wav" | tee "$R/artifact.sha256"
          rm -f "$OUT" "$OUT.info.json"

      - name: Start the MusicGen server on an admitted idle A100
        id: musicgen_start
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/musicgen-gradio"
          mkdir -p "$R"
          GPU="$("$CONDA_EXE" run --no-capture-output -n phase2_3d python -c 'from oec_gpu_admission import select_idle_a100_gpu; print(select_idle_a100_gpu(caller="MUSICGEN_NOTEBOOK_ACCEPTANCE")["index"])' | tail -n 1)"
          echo "MUSICGEN_PHYSICAL_GPU=$GPU" | tee "$R/gpu.txt"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py start audiocraft-api \
            --provider musicgen --gpu "$GPU" --port 7875 --allow-download --accept-noncommercial-license 2>&1 | tee "$R/service-start.log"

      - name: Wait for MusicGen model server readiness
        id: musicgen_health
        if: always() && steps.musicgen_start.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/musicgen-gradio"
          HEALTH_CODE='import json, urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); health=json.load(opener.open("http://127.0.0.1:7875/health", timeout=3)); assert not health.get("error") or health.get("loading", False), "fatal model load error: " + str(health.get("error")); assert health.get("ready") and health.get("model_loaded"), health; print(json.dumps(health))'
          ready=0
          for _ in $(seq 1 240); do
            if "$HOME/Conda/envs/phase2_3d/bin/python" -c "$HEALTH_CODE" >"$R/health-check.log" 2>&1; then ready=1; break; fi
            sleep 5
          done
          cat "$R/health-check.log"
          test "$ready" -eq 1

      - name: Launch MusicGen Gradio UI and generate real music
        id: musicgen_gradio
        if: always() && steps.musicgen_health.outcome == 'success'
        continue-on-error: true
        env:
          OEC_MEDIA_API_URL: "http://127.0.0.1:7875"
          OEC_GRADIO_HEADLESS_SMOKE: "1"
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/musicgen-gradio"
          timeout --signal=INT --kill-after=20s 1800s "$CONDA_EXE" run --no-capture-output -n phase1 \
            python tools/run_gradio_model_notebook_smokes.py --provider musicgen --report-dir "$R" 2>&1 | tee "$R/gradio-callback.log"

      - name: Stop the managed MusicGen service
        if: always()
        run: |
          set +e
          R="$OEC_ACCEPTANCE_ROOT/musicgen-gradio"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py logs audiocraft-api --tail 120 >"$R/service-final.log" 2>&1
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py stop audiocraft-api --grace-seconds 25 >>"$R/service-final.log" 2>&1
          exit 0

      - name: Purge MusicGen cache after the service is stopped
        id: musicgen_purge
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/musicgen-gradio"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/cleanup_test_model_caches.py --models musicgen-medium --report-json "$R/cache-cleanup.json" 2>&1 | tee "$R/cache-cleanup.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/model_cache_manager.py status 2>&1 | tee -a "$OEC_ACCEPTANCE_ROOT/musicgen-gradio/cache-cleanup.log"

      - name: Prepare speech checkpoints and isolated runtime
        id: speech_prepare
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/speech"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-before.log"
          for model in kokoro whisper-turbo qwen3-asr-0.6b; do
            "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/prepare_media_models.py download --model "$model" 2>&1 | tee -a "$R/checkpoint-preparation.log"
          done
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/prepare_media_runtime.py 2>&1 | tee "$R/runtime-setup.log"

      - name: Run Kokoro, Whisper and Qwen3-ASR Gradio modes and purge each tested cache
        id: speech_gradio
        if: always() && steps.speech_prepare.outcome == 'success'
        continue-on-error: true
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/speech"
          mkdir -p "$R"
          set +e
          timeout --signal=INT --kill-after=30s 3600s "$CONDA_EXE" run --no-capture-output -n phase2_3d \
            python tools/run_media_model_smokes.py --providers kokoro,whisper,qwen3-asr \
            --check-gradio-notebooks --purge-after --require-pass 2>&1 | tee "$R/speech-gradio-acceptance.log"
          smoke_rc=${PIPESTATUS[0]}
          set -e
          for report in kokoro whisper qwen3-asr; do
            for suffix in service smoke; do
              src="$RUNNER_TEMP/oec-media-smoke-logs/$report-$suffix.log"
              if [[ -f "$src" ]]; then cp "$src" "$R/"; fi
            done
            src="$RUNNER_TEMP/oec-media-smoke-logs/$report-gradio-notebook-smoke.json"
            if [[ -f "$src" ]]; then cp "$src" "$R/"; fi
          done
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/cleanup_test_model_caches.py \
            --models kokoro,whisper-turbo,qwen3-asr-0.6b --report-json "$R/cache-cleanup.json" 2>&1 | tee "$R/cache-cleanup.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/model_cache_manager.py status 2>&1 | tee "$R/cache-status-after.log"
          exit "$smoke_rc"

      - name: Recover timed-out speech backends and purge their caches safely
        id: speech_purge_recovery
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/speech"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/run_media_model_smokes.py \
            --providers kokoro,whisper,qwen3-asr --cleanup-owned-services 2>&1 | tee "$R/orphan-service-cleanup.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/cleanup_test_model_caches.py \
            --models kokoro,whisper-turbo,qwen3-asr-0.6b --report-json "$R/cache-cleanup-recovery.json" 2>&1 | tee "$R/cache-cleanup-recovery.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/model_cache_manager.py status 2>&1 | tee "$R/cache-status-after-recovery.log"

      - name: Prepare ACE-Step checkpoints and isolated runtime
        id: ace_prepare
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/ace-step"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-before.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/prepare_media_models.py download --model ace-step-main 2>&1 | tee "$R/prepare-main.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/prepare_media_models.py download --model ace-step-lm-0.6b 2>&1 | tee "$R/prepare-lm.log"
          ACE_BASE_PYTHON=""
          for candidate in \
            "$HOME/Conda/envs/oec_deploy/bin/python" \
            "$HOME/Conda/envs/phase1_ltx/bin/python" \
            "$HOME/Conda/envs/phase2_3d/bin/python" \
            "$HOME/Conda/envs/phase1/bin/python"; do
            [[ -x "$candidate" ]] || continue
            version="$("$candidate" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")' 2>/dev/null || true)"
            case "$version" in
              3.11|3.12) ACE_BASE_PYTHON="$candidate"; echo "ACE_STEP_BOOTSTRAP_PYTHON=$candidate" | tee -a "$R/runtime-setup.log"; break ;;
            esac
          done
          test -n "$ACE_BASE_PYTHON"
          "$ACE_BASE_PYTHON" tools/prepare_ace_step_runtime.py ensure 2>&1 | tee "$R/runtime-setup.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-after-prepare.log"

      - name: Run ACE-Step isolated server and Gradio callback acceptance
        id: ace_gradio
        if: always() && steps.ace_prepare.outcome == 'success'
        continue-on-error: true
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/ace-step"
          mkdir -p "$R"
          set +e
          timeout --signal=INT --kill-after=30s 3600s "$CONDA_EXE" run --no-capture-output -n phase2_3d \
            python tools/run_media_model_smokes.py --providers ace-step --check-gradio-notebooks --purge-after --require-pass 2>&1 | tee "$R/ace-step-gradio-acceptance.log"
          smoke_rc=${PIPESTATUS[0]}
          set -e
          for log_name in ace-step-service.log ace-step-smoke.log; do
            src="$RUNNER_TEMP/oec-media-smoke-logs/$log_name"
            if [[ -f "$src" ]]; then cp "$src" "$R/"; fi
          done
          report="$RUNNER_TEMP/oec-media-smoke-logs/ace-step-gradio-notebook-smoke.json"
          if [[ -f "$report" ]]; then cp "$report" "$R/"; fi
          exit "$smoke_rc"

      - name: Recover interrupted ACE-Step backend before cache cleanup
        id: ace_process_recovery
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/ace-step"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/run_media_model_smokes.py \
            --providers ace-step --cleanup-owned-services 2>&1 | tee "$R/orphan-service-cleanup.log"

      - name: Assert ACE-Step model cache cleanup after inference
        id: ace_purge
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/ace-step"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/cleanup_test_model_caches.py \
            --models ace-step --report-json "$R/cache-cleanup.json" 2>&1 | tee "$R/cache-cleanup.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-after-cleanup.log"

      - name: Verify storage admission before TRELLIS cache/model startup
        id: trellis_prepare
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/trellis"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-before.log"

      - name: Start TRELLIS model server on an admitted idle A100
        id: trellis_start
        if: always() && steps.trellis_prepare.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/trellis"
          GPU="$("$CONDA_EXE" run --no-capture-output -n phase2_3d python -c 'from oec_gpu_admission import select_idle_a100_gpu; print(select_idle_a100_gpu(caller="TRELLIS_NOTEBOOK_ACCEPTANCE")["index"])' | tail -n 1)"
          echo "TRELLIS_PHYSICAL_GPU=$GPU" | tee "$R/gpu.txt"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py start trellis-api --gpu "$GPU" --port 7868 --allow-download 2>&1 | tee "$R/service-start.log"

      - name: Wait for TRELLIS model server readiness
        id: trellis_health
        if: always() && steps.trellis_start.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/trellis"
          HEALTH_CODE="$(cat <<'PY'
          import json
          import urllib.error
          import urllib.request
          url = "http://127.0.0.1:7868/health"
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          try:
          response = opener.open(url, timeout=3)
          except urllib.error.HTTPError as exc:
          response = exc
          health = json.load(response)
          if health.get("error") and not health.get("loading", False):
          raise RuntimeError("fatal model load error: " + str(health["error"]))
          assert health.get("ready") and health.get("model_loaded"), health
          print(json.dumps(health))
          PY
          )"
          ready=0
          for _ in $(seq 1 240); do
            if "$HOME/Conda/envs/phase2_3d/bin/python" -c "$HEALTH_CODE" >"$R/health-check.log" 2>&1; then ready=1; break; fi
            sleep 5
          done
          cat "$R/health-check.log"
          test "$ready" -eq 1

      - name: Exercise standalone TRELLIS notebook Gradio callback and validate GLB
        id: trellis_only_gradio
        if: always() && steps.trellis_health.outcome == 'success'
        continue-on-error: true
        env:
          OEC_MEDIA_API_URL: "http://127.0.0.1:7868"
          OEC_TRELLIS_API_URL: "http://127.0.0.1:7868"
          OEC_GRADIO_HEADLESS_SMOKE: "1"
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/trellis"
          timeout --signal=INT --kill-after=30s 2400s "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/run_gradio_model_notebook_smokes.py --provider trellis-only --report-dir "$R" 2>&1 | tee "$R/trellis-only-gradio-callback.log"

      - name: Exercise combined TRELLIS/FLUX notebook TRELLIS callback and validate GLB
        id: trellis_combined_gradio
        if: always() && steps.trellis_health.outcome == 'success'
        continue-on-error: true
        env:
          OEC_MEDIA_API_URL: "http://127.0.0.1:7868"
          OEC_TRELLIS_API_URL: "http://127.0.0.1:7868"
          OEC_GRADIO_HEADLESS_SMOKE: "1"
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/trellis"
          timeout --signal=INT --kill-after=30s 2400s "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/run_gradio_model_notebook_smokes.py --provider trellis-combined --report-dir "$R" 2>&1 | tee "$R/trellis-combined-gradio-callback.log"

      - name: Stop managed TRELLIS service and save diagnostics
        if: always()
        run: |
          set +e
          R="$OEC_ACCEPTANCE_ROOT/trellis"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py logs trellis-api --tail 150 >"$R/service-final.log" 2>&1
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py stop trellis-api --grace-seconds 25 >>"$R/service-final.log" 2>&1
          exit 0

      - name: Purge TRELLIS model cache after verified service shutdown
        id: trellis_purge
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/cleanup_test_model_caches.py --models trellis-2-4b --report-json "$OEC_ACCEPTANCE_ROOT/trellis/cache-cleanup.json" 2>&1 | tee "$OEC_ACCEPTANCE_ROOT/trellis/cache-cleanup.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/model_cache_manager.py status 2>&1 | tee -a "$OEC_ACCEPTANCE_ROOT/trellis/cache-cleanup.log"

      - name: Prepare FLUX cache through StorageManager admission
        id: flux_cache_prepare
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/flux"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-before.log"
          timeout --signal=INT --kill-after=30s 1800s "$CONDA_EXE" run --no-capture-output -n phase2_3d \
            python tools/prepare_flux_cache.py --allow-download 2>&1 | tee "$R/flux-cache-preparation.log"

      - name: Start the FLUX model server on an admitted idle A100
        id: flux_start
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/flux"
          mkdir -p "$R"
          GPU="$("$CONDA_EXE" run --no-capture-output -n phase2_3d python -c 'from oec_gpu_admission import select_idle_a100_gpu; print(select_idle_a100_gpu(caller="FLUX_NOTEBOOK_ACCEPTANCE")["index"])' | tail -n 1)"
          echo "FLUX_PHYSICAL_GPU=$GPU" | tee "$R/gpu.txt"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py start flux-api \
            --gpu "$GPU" --port 7867 --allow-download 2>&1 | tee "$R/service-start.log"

      - name: Wait for FLUX model server readiness
        id: flux_health
        if: always() && steps.flux_start.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/flux"
          HEALTH_CODE="$(cat <<'PY'
          import json
          import urllib.error
          import urllib.request
          url = "http://127.0.0.1:7867/health"
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          try:
          response = opener.open(url, timeout=3)
          except urllib.error.HTTPError as exc:
          response = exc
          health = json.load(response)
          if health.get("error") and not health.get("loading", False):
          raise RuntimeError("fatal model load error: " + str(health["error"]))
          assert health.get("ready") and health.get("model_loaded"), health
          print(json.dumps(health))
          PY
          )"
          ready=0
          for _ in $(seq 1 240); do
            if "$HOME/Conda/envs/phase2_3d/bin/python" -c "$HEALTH_CODE" >"$R/health-check.log" 2>&1; then ready=1; break; fi
            sleep 5
          done
          cat "$R/health-check.log"
          test "$ready" -eq 1

      - name: Launch FLUX Gradio UI and generate a real PNG through the model server
        id: flux_gradio
        if: always() && steps.flux_health.outcome == 'success'
        continue-on-error: true
        env:
          OEC_MEDIA_API_URL: "http://127.0.0.1:7867"
          OEC_GRADIO_HEADLESS_SMOKE: "1"
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/flux"
          mkdir -p "$R"
          timeout --signal=INT --kill-after=30s 2400s "$CONDA_EXE" run --no-capture-output -n phase2_3d \
            python tools/run_gradio_model_notebook_smokes.py --provider flux --report-dir "$R" 2>&1 | tee "$R/flux-gradio-callback.log"

      - name: Launch combined notebook FLUX Gradio cell against the live server
        id: flux_combined_gradio
        if: always() && steps.flux_health.outcome == 'success'
        continue-on-error: true
        env:
          OEC_FLUX_API_URL: "http://127.0.0.1:7867"
          OEC_GRADIO_HEADLESS_SMOKE: "1"
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/flux"
          mkdir -p "$R"
          timeout --signal=INT --kill-after=30s 2400s "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/run_gradio_model_notebook_smokes.py --provider flux-combined --report-dir "$R" 2>&1 | tee "$R/flux-combined-gradio-callback.log"

      - name: Stop the managed FLUX service and record final storage status
        if: always()
        run: |
          set +e
          R="$OEC_ACCEPTANCE_ROOT/flux"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py logs flux-api --tail 100 >"$R/service-final.log" 2>&1
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py stop flux-api --grace-seconds 25 >>"$R/service-final.log" 2>&1
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status >"$R/storage-after.log" 2>&1
          exit 0

      - name: Purge FLUX cache after the model service is stopped
        id: flux_purge
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/cleanup_test_model_caches.py --models flux-klein-4b --report-json "$OEC_ACCEPTANCE_ROOT/flux/cache-cleanup.json" 2>&1 | tee "$OEC_ACCEPTANCE_ROOT/flux/cache-cleanup.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/model_cache_manager.py status 2>&1 | tee -a "$OEC_ACCEPTANCE_ROOT/flux/cache-cleanup.log"

      - name: Start LTX model server for both video notebook modes
        id: ltx_start
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/ltx"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-before.log"
          GPU="$("$CONDA_EXE" run --no-capture-output -n phase2_3d python -c 'from oec_gpu_admission import select_idle_a100_gpu; print(select_idle_a100_gpu(caller="LTX_NOTEBOOK_ACCEPTANCE")["index"])' | tail -n 1)"
          echo "LTX_PHYSICAL_GPU=$GPU" | tee "$R/gpu.txt"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py start ltx-api --gpu "$GPU" --port 7869 --allow-download 2>&1 | tee "$R/service-start.log"

      - name: Wait for LTX model server readiness
        id: ltx_health
        if: always() && steps.ltx_start.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/ltx"
          HEALTH_CODE="$(cat <<'PY'
          import json
          import urllib.error
          import urllib.request
          url = "http://127.0.0.1:7869/health"
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          try:
          response = opener.open(url, timeout=4)
          except urllib.error.HTTPError as exc:
          response = exc
          health = json.load(response)
          if health.get("error") and not health.get("loading", False):
          raise RuntimeError("fatal model load error: " + str(health["error"]))
          assert health.get("ready") and health.get("model_loaded"), health
          print(json.dumps(health))
          PY
          )"
          ready=0
          for _ in $(seq 1 360); do
            if "$HOME/Conda/envs/phase2_3d/bin/python" -c "$HEALTH_CODE" >"$R/health-check.log" 2>&1; then ready=1; break; fi
            sleep 5
          done
          cat "$R/health-check.log"
          test "$ready" -eq 1

      - name: Generate and decode LTX text-to-video MP4 through Gradio HTTP
        id: ltx_text_video
        if: always() && steps.ltx_health.outcome == 'success'
        continue-on-error: true
        env:
          OEC_MEDIA_API_URL: "http://127.0.0.1:7869"
          OEC_LTX_SERVICE_URL: "http://127.0.0.1:7869"
          OEC_GRADIO_HEADLESS_SMOKE: "1"
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/ltx"
          timeout --signal=INT --kill-after=30s 2400s "$CONDA_EXE" run --no-capture-output -n phase1_ltx \
            python tools/run_gradio_model_notebook_smokes.py --provider ltx-text-video --report-dir "$R" 2>&1 | tee "$R/text-to-video-gradio.log"

      - name: Generate and decode LTX image-to-video MP4 through Gradio HTTP
        id: ltx_image_video
        if: always() && steps.ltx_health.outcome == 'success'
        continue-on-error: true
        env:
          OEC_MEDIA_API_URL: "http://127.0.0.1:7869"
          OEC_LTX_SERVICE_URL: "http://127.0.0.1:7869"
          OEC_GRADIO_HEADLESS_SMOKE: "1"
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/ltx"
          timeout --signal=INT --kill-after=30s 2400s "$CONDA_EXE" run --no-capture-output -n phase1_ltx \
            python tools/run_gradio_model_notebook_smokes.py --provider ltx-image-video --report-dir "$R" 2>&1 | tee "$R/image-to-video-gradio.log"

      - name: Stop LTX service and purge model plus Gemma caches
        id: ltx_purge
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          R="$OEC_ACCEPTANCE_ROOT/ltx"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py logs ltx-api --tail 180 >"$R/service-final.log" 2>&1
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py stop ltx-api --grace-seconds 30 >>"$R/service-final.log" 2>&1
          set -e
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/cleanup_test_model_caches.py \
            --models ltx-2.3,gemma-3-12b --report-json "$R/cache-cleanup.json" 2>&1 | tee "$R/cache-cleanup.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-after-cleanup.log"

      - name: Execute all Wan notebook cells and decode generated video
        id: wan_notebook
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        env:
          OEC_WAN_ALLOW_DOWNLOAD: "1"
          OEC_WAN_NUM_FRAMES: "9"
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/wan"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-before.log"
          timeout --signal=INT --kill-after=30s 3600s "$CONDA_EXE" run --no-capture-output -n phase1 \
            env OEC_WAN_SMOKE_DIR="$R" OEC_WAN_ALLOW_DOWNLOAD="$OEC_WAN_ALLOW_DOWNLOAD" OEC_WAN_NUM_FRAMES="$OEC_WAN_NUM_FRAMES" \
            python tools/run_wan_notebook_smoke.py 2>&1 | tee "$R/wan-notebook-execution.log"
          test -s "$R/wan-notebook-generated.mp4"

      - name: Purge Wan weights only after notebook process has exited
        id: wan_purge
        if: always() && steps.preflight.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/wan"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/cleanup_test_model_caches.py \
            --models wan-t2v-14b --report-json "$R/cache-cleanup.json" 2>&1 | tee "$R/cache-cleanup.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-after-cleanup.log"

      - name: Capture final OEC storage and GPU state
        if: always()
        run: |
          set +e
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status >"$OEC_ACCEPTANCE_ROOT/storage-after.log" 2>&1
          nvidia-smi >"$OEC_ACCEPTANCE_ROOT/nvidia-smi-after.txt" 2>&1
          exit 0

      - name: Upload model outputs, metadata, traces, and storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oec-targeted-model-notebook-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/oec-demo-notebook-acceptance-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Require every model acceptance stage to pass
        if: always()
        env:
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          SAFE_CONTROL_NOTEBOOKS_OUTCOME: ${{ steps.safe_control_notebooks.outcome }}
          AUDIOGEN_NOTEBOOK_OUTCOME: ${{ steps.audiogen_full_notebook.outcome }}
          AUDIOGEN_START_OUTCOME: ${{ steps.audiogen_start.outcome }}
          AUDIOGEN_HEALTH_OUTCOME: ${{ steps.audiogen_health.outcome }}
          AUDIOGEN_GRADIO_OUTCOME: ${{ steps.audiogen_gradio.outcome }}
          AUDIOGEN_PURGE_OUTCOME: ${{ steps.audiogen_purge.outcome }}
          MUSICGEN_START_OUTCOME: ${{ steps.musicgen_start.outcome }}
