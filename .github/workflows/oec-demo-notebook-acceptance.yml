          FLUX_CACHE_OUTCOME: ${{ steps.flux_cache_prepare.outcome }}
          FLUX_START_OUTCOME: ${{ steps.flux_start.outcome }}
          FLUX_HEALTH_OUTCOME: ${{ steps.flux_health.outcome }}
          FLUX_GRADIO_OUTCOME: ${{ steps.flux_gradio.outcome }}
          FLUX_COMBINED_GRADIO_OUTCOME: ${{ steps.flux_combined_gradio.outcome }}
          FLUX_PURGE_OUTCOME: ${{ steps.flux_purge.outcome }}
          MUSICGEN_CLI_OUTCOME: ${{ steps.musicgen_cli.outcome }}
          SPEECH_PREPARE_OUTCOME: ${{ steps.speech_prepare.outcome }}
          SPEECH_GRADIO_OUTCOME: ${{ steps.speech_gradio.outcome }}
          SPEECH_PURGE_RECOVERY_OUTCOME: ${{ steps.speech_purge_recovery.outcome }}
          ACE_PROCESS_RECOVERY_OUTCOME: ${{ steps.ace_process_recovery.outcome }}
          LTX_START_OUTCOME: ${{ steps.ltx_start.outcome }}
          LTX_HEALTH_OUTCOME: ${{ steps.ltx_health.outcome }}
          LTX_TEXT_VIDEO_OUTCOME: ${{ steps.ltx_text_video.outcome }}
          LTX_IMAGE_VIDEO_OUTCOME: ${{ steps.ltx_image_video.outcome }}
          LTX_PURGE_OUTCOME: ${{ steps.ltx_purge.outcome }}
          WAN_NOTEBOOK_OUTCOME: ${{ steps.wan_notebook.outcome }}
          WAN_PURGE_OUTCOME: ${{ steps.wan_purge.outcome }}
        run: |
          set -euo pipefail
          printf 'CONTRACTS_OUTCOME=%s\n' "$CONTRACTS_OUTCOME"
          printf 'SAFE_CONTROL_NOTEBOOKS_OUTCOME=%s\n' "$SAFE_CONTROL_NOTEBOOKS_OUTCOME"
          printf 'AUDIOGEN_NOTEBOOK_OUTCOME=%s\n' "$AUDIOGEN_NOTEBOOK_OUTCOME"
          printf 'AUDIOGEN_START_OUTCOME=%s\n' "$AUDIOGEN_START_OUTCOME"
          printf 'AUDIOGEN_HEALTH_OUTCOME=%s\n' "$AUDIOGEN_HEALTH_OUTCOME"
          printf 'AUDIOGEN_GRADIO_OUTCOME=%s\n' "$AUDIOGEN_GRADIO_OUTCOME"
          printf 'AUDIOGEN_PURGE_OUTCOME=%s\n' "$AUDIOGEN_PURGE_OUTCOME"
          printf 'MUSICGEN_START_OUTCOME=%s\n' "$MUSICGEN_START_OUTCOME"
          printf 'MUSICGEN_HEALTH_OUTCOME=%s\n' "$MUSICGEN_HEALTH_OUTCOME"
          printf 'MUSICGEN_GRADIO_OUTCOME=%s\n' "$MUSICGEN_GRADIO_OUTCOME"
          printf 'MUSICGEN_PURGE_OUTCOME=%s\n' "$MUSICGEN_PURGE_OUTCOME"
          printf 'ACE_PREPARE_OUTCOME=%s\n' "$ACE_PREPARE_OUTCOME"
          printf 'ACE_GRADIO_OUTCOME=%s\n' "$ACE_GRADIO_OUTCOME"
          printf 'ACE_PURGE_OUTCOME=%s\n' "$ACE_PURGE_OUTCOME"
          printf 'TRELLIS_PREPARE_OUTCOME=%s\n' "$TRELLIS_PREPARE_OUTCOME"
          printf 'TRELLIS_START_OUTCOME=%s\n' "$TRELLIS_START_OUTCOME"
          printf 'TRELLIS_HEALTH_OUTCOME=%s\n' "$TRELLIS_HEALTH_OUTCOME"
          printf 'TRELLIS_ONLY_GRADIO_OUTCOME=%s\n' "$TRELLIS_ONLY_GRADIO_OUTCOME"
          printf 'TRELLIS_COMBINED_GRADIO_OUTCOME=%s\n' "$TRELLIS_COMBINED_GRADIO_OUTCOME"
