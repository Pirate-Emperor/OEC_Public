          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py stop trellis-api --grace-seconds 25 >"$R/prior-service-stop.log" 2>&1
          stop_rc=$?
          set -e
          cat "$R/prior-service-stop.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -c 'import socket,sys; s=socket.socket(); s.settimeout(1); rc=s.connect_ex(("127.0.0.1",7868)); s.close(); print(f"TRELLIS_PORT_7868_FREE={rc != 0}"); sys.exit(1 if rc == 0 else 0)'
          echo "TRELLIS_PRIOR_SERVICE_STOP_RC=$stop_rc" | tee -a "$R/prior-service-stop.log"

      - name: Verify storage admission before TRELLIS cache/model startup
        id: trellis_prepare
        if: always() && steps.preflight.outcome == 'success' && steps.scope.outputs.trellis == 'true' && steps.trellis_orphan_recovery.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/trellis"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-before.log"

      - name: Start TRELLIS model server on an admitted idle A100
        id: trellis_start
        if: always() && steps.trellis_prepare.outcome == 'success' && steps.scope.outputs.trellis == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/trellis"
          GPU="$("$CONDA_EXE" run --no-capture-output -n phase2_3d python -c 'from oec_gpu_admission import select_idle_a100_gpu; print(select_idle_a100_gpu(caller="TRELLIS_NOTEBOOK_ACCEPTANCE")["index"])' | tail -n 1)"
          echo "TRELLIS_PHYSICAL_GPU=$GPU" | tee "$R/gpu.txt"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py start trellis-api --gpu "$GPU" --port 7868 --allow-download 2>&1 | tee "$R/service-start.log"

      - name: Wait for TRELLIS model server readiness
        id: trellis_health
        if: always() && steps.trellis_start.outcome == 'success' && steps.scope.outputs.trellis == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/trellis"
          HEALTH_CODE='import json, urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); health=json.load(opener.open("http://127.0.0.1:7868/health", timeout=4)); assert not health.get("error") or health.get("loading", False), "fatal model load error: " + str(health.get("error")); assert health.get("ready") and health.get("model_loaded"), health; print(json.dumps(health))'
          ready=0
          for _ in $(seq 1 240); do
            if "$HOME/Conda/envs/phase2_3d/bin/python" -c "$HEALTH_CODE" >"$R/health-check.log" 2>&1; then ready=1; break; fi
            sleep 5
          done
          cat "$R/health-check.log"
          test "$ready" -eq 1

      - name: Exercise standalone TRELLIS notebook Gradio callback and validate GLB
        id: trellis_only_gradio
