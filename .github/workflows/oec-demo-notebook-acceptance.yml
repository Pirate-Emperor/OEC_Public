            python tools/run_gradio_model_notebook_smokes.py --provider ltx-text-video --report-dir "$R" 2>&1 | tee "$R/text-to-video-gradio.log"

      - name: Generate and decode LTX image-to-video MP4 through Gradio HTTP
        id: ltx_image_video
        if: always() && steps.ltx_health.outcome == 'success' && steps.scope.outputs.ltx == 'true'
        continue-on-error: true
        env:
          OEC_MEDIA_API_URL: "http://127.0.0.1:7869"
          OEC_LTX_SERVICE_URL: "http://127.0.0.1:7869"
          OEC_GRADIO_HEADLESS_SMOKE: "1"
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/ltx"
          timeout --signal=INT --kill-after=30s 2400s "$CONDA_EXE" run --no-capture-output -n phase1_ltx \
            python tools/run_gradio_model_notebook_smokes.py --provider ltx-image-video --report-dir "$R" 2>&1 | tee "$R/image-to-video-gradio.log"

      - name: Stop LTX service and purge model plus Gemma caches
        id: ltx_purge
        if: always() && steps.preflight.outcome == 'success' && steps.scope.outputs.ltx == 'true'
        continue-on-error: true
        run: |
          set +e
          R="$OEC_ACCEPTANCE_ROOT/ltx"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py logs ltx-api --tail 180 >"$R/service-final.log" 2>&1
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py stop ltx-api --grace-seconds 30 >>"$R/service-final.log" 2>&1
          set -e
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/cleanup_test_model_caches.py \
            --models ltx-2.3,gemma-3-12b --report-json "$R/cache-cleanup.json" 2>&1 | tee "$R/cache-cleanup.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-after-cleanup.log"

      - name: Execute all Wan notebook cells and decode generated video
        id: wan_notebook
        if: always() && steps.preflight.outcome == 'success' && steps.scope.outputs.wan == 'true'
        continue-on-error: true
        env:
          OEC_WAN_ALLOW_DOWNLOAD: "1"
          OEC_WAN_NUM_FRAMES: "9"
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/wan"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-before.log"
          timeout --signal=INT --kill-after=30s 3600s "$CONDA_EXE" run --no-capture-output -n phase1 \
            env OEC_WAN_SMOKE_DIR="$R" OEC_WAN_ALLOW_DOWNLOAD="$OEC_WAN_ALLOW_DOWNLOAD" OEC_WAN_NUM_FRAMES="$OEC_WAN_NUM_FRAMES" \
            python tools/run_wan_notebook_smoke.py 2>&1 | tee "$R/wan-notebook-execution.log"
          test -s "$R/wan-notebook-generated.mp4"

      - name: Purge Wan weights only after notebook process has exited
        id: wan_purge
        if: always() && steps.preflight.outcome == 'success' && steps.scope.outputs.wan == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/wan"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/cleanup_test_model_caches.py \
            --models wan-t2v-14b --report-json "$R/cache-cleanup.json" 2>&1 | tee "$R/cache-cleanup.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-after-cleanup.log"

      - name: Capture final OEC storage and GPU state
        if: always()
        run: |
          set +e
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status >"$OEC_ACCEPTANCE_ROOT/storage-after.log" 2>&1
          nvidia-smi >"$OEC_ACCEPTANCE_ROOT/nvidia-smi-after.txt" 2>&1
          exit 0

      - name: Upload model outputs, metadata, traces, and storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oec-targeted-model-notebook-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/oec-demo-notebook-acceptance-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 7

      - name: Require every model acceptance stage to pass
        if: always()
        env:
          RUN_SCOPE_CONTROLS: ${{ steps.scope.outputs.controls }}
          RUN_SCOPE_DEPLOYMENT: ${{ steps.scope.outputs.deployment }}
          RUN_SCOPE_ENCRYPTED_HF: ${{ steps.scope.outputs.encrypted_hf }}
          RUN_SCOPE_AUDIOCRAFT_NOTEBOOK: ${{ steps.scope.outputs.audiocraft_notebook }}
          RUN_SCOPE_AUDIOGEN: ${{ steps.scope.outputs.audiogen }}
          RUN_SCOPE_MUSICGEN: ${{ steps.scope.outputs.musicgen }}
          RUN_SCOPE_SPEECH: ${{ steps.scope.outputs.speech }}
          RUN_SCOPE_ACE_STEP: ${{ steps.scope.outputs.ace_step }}
          RUN_SCOPE_TRELLIS: ${{ steps.scope.outputs.trellis }}
          RUN_SCOPE_FLUX: ${{ steps.scope.outputs.flux }}
          RUN_SCOPE_LTX: ${{ steps.scope.outputs.ltx }}
          RUN_SCOPE_WAN: ${{ steps.scope.outputs.wan }}
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          SAFE_CONTROL_NOTEBOOKS_OUTCOME: ${{ steps.safe_control_notebooks.outcome }}
          DEPLOYMENT_NOTEBOOK_OUTCOME: ${{ steps.deployment_notebook.outcome }}
          ENCRYPTED_HF_PREFLIGHT_OUTCOME: ${{ steps.encrypted_hf_preflight.outcome }}
          AUDIOGEN_NOTEBOOK_OUTCOME: ${{ steps.audiogen_full_notebook.outcome }}
          AUDIOGEN_START_OUTCOME: ${{ steps.audiogen_start.outcome }}
          AUDIOGEN_HEALTH_OUTCOME: ${{ steps.audiogen_health.outcome }}
          AUDIOGEN_GRADIO_OUTCOME: ${{ steps.audiogen_gradio.outcome }}
          AUDIOGEN_PURGE_OUTCOME: ${{ steps.audiogen_purge.outcome }}
          MUSICGEN_START_OUTCOME: ${{ steps.musicgen_start.outcome }}
          MUSICGEN_HEALTH_OUTCOME: ${{ steps.musicgen_health.outcome }}
          MUSICGEN_GRADIO_OUTCOME: ${{ steps.musicgen_gradio.outcome }}
          MUSICGEN_PURGE_OUTCOME: ${{ steps.musicgen_purge.outcome }}
          ACE_PREPARE_OUTCOME: ${{ steps.ace_prepare.outcome }}
          ACE_GRADIO_OUTCOME: ${{ steps.ace_gradio.outcome }}
          ACE_PURGE_OUTCOME: ${{ steps.ace_purge.outcome }}
          TRELLIS_RECOVERY_OUTCOME: ${{ steps.trellis_orphan_recovery.outcome }}
          TRELLIS_PREPARE_OUTCOME: ${{ steps.trellis_prepare.outcome }}
          TRELLIS_START_OUTCOME: ${{ steps.trellis_start.outcome }}
          TRELLIS_HEALTH_OUTCOME: ${{ steps.trellis_health.outcome }}
          TRELLIS_ONLY_GRADIO_OUTCOME: ${{ steps.trellis_only_gradio.outcome }}
          TRELLIS_COMBINED_GRADIO_OUTCOME: ${{ steps.trellis_combined_gradio.outcome }}
          TRELLIS_PURGE_OUTCOME: ${{ steps.trellis_purge.outcome }}
          FLUX_CACHE_OUTCOME: ${{ steps.flux_cache_prepare.outcome }}
          FLUX_START_OUTCOME: ${{ steps.flux_start.outcome }}
          FLUX_HEALTH_OUTCOME: ${{ steps.flux_health.outcome }}
          FLUX_GRADIO_OUTCOME: ${{ steps.flux_gradio.outcome }}
          FLUX_COMBINED_GRADIO_OUTCOME: ${{ steps.flux_combined_gradio.outcome }}
          FLUX_PURGE_OUTCOME: ${{ steps.flux_purge.outcome }}
          MUSICGEN_RECOVERY_OUTCOME: ${{ steps.musicgen_recovery.outcome }}
          MUSICGEN_CLI_OUTCOME: ${{ steps.musicgen_cli.outcome }}
          SPEECH_PREPARE_OUTCOME: ${{ steps.speech_prepare.outcome }}
          SPEECH_GRADIO_OUTCOME: ${{ steps.speech_gradio.outcome }}
          SPEECH_PURGE_RECOVERY_OUTCOME: ${{ steps.speech_purge_recovery.outcome }}
          ACE_PROCESS_RECOVERY_OUTCOME: ${{ steps.ace_process_recovery.outcome }}
          LTX_START_OUTCOME: ${{ steps.ltx_start.outcome }}
          LTX_HEALTH_OUTCOME: ${{ steps.ltx_health.outcome }}
          LTX_TEXT_VIDEO_OUTCOME: ${{ steps.ltx_text_video.outcome }}
          LTX_IMAGE_VIDEO_OUTCOME: ${{ steps.ltx_image_video.outcome }}
          LTX_PURGE_OUTCOME: ${{ steps.ltx_purge.outcome }}
          WAN_NOTEBOOK_OUTCOME: ${{ steps.wan_notebook.outcome }}
          WAN_PURGE_OUTCOME: ${{ steps.wan_purge.outcome }}
        run: |
          set -euo pipefail
          printf 'CONTRACTS_OUTCOME=%s\n' "$CONTRACTS_OUTCOME"
          printf 'SAFE_CONTROL_NOTEBOOKS_OUTCOME=%s\n' "$SAFE_CONTROL_NOTEBOOKS_OUTCOME"
          printf 'DEPLOYMENT_NOTEBOOK_OUTCOME=%s\n' "$DEPLOYMENT_NOTEBOOK_OUTCOME"
          printf 'ENCRYPTED_HF_PREFLIGHT_OUTCOME=%s\n' "$ENCRYPTED_HF_PREFLIGHT_OUTCOME"
          printf 'AUDIOGEN_NOTEBOOK_OUTCOME=%s\n' "$AUDIOGEN_NOTEBOOK_OUTCOME"
          printf 'AUDIOGEN_START_OUTCOME=%s\n' "$AUDIOGEN_START_OUTCOME"
          printf 'AUDIOGEN_HEALTH_OUTCOME=%s\n' "$AUDIOGEN_HEALTH_OUTCOME"
          printf 'AUDIOGEN_GRADIO_OUTCOME=%s\n' "$AUDIOGEN_GRADIO_OUTCOME"
          printf 'AUDIOGEN_PURGE_OUTCOME=%s\n' "$AUDIOGEN_PURGE_OUTCOME"
          printf 'MUSICGEN_RECOVERY_OUTCOME=%s\n' "$MUSICGEN_RECOVERY_OUTCOME"
          printf 'MUSICGEN_START_OUTCOME=%s\n' "$MUSICGEN_START_OUTCOME"
          printf 'MUSICGEN_HEALTH_OUTCOME=%s\n' "$MUSICGEN_HEALTH_OUTCOME"
          printf 'MUSICGEN_GRADIO_OUTCOME=%s\n' "$MUSICGEN_GRADIO_OUTCOME"
          printf 'MUSICGEN_PURGE_OUTCOME=%s\n' "$MUSICGEN_PURGE_OUTCOME"
          printf 'ACE_PREPARE_OUTCOME=%s\n' "$ACE_PREPARE_OUTCOME"
          printf 'ACE_GRADIO_OUTCOME=%s\n' "$ACE_GRADIO_OUTCOME"
          printf 'ACE_PURGE_OUTCOME=%s\n' "$ACE_PURGE_OUTCOME"
          printf 'TRELLIS_RECOVERY_OUTCOME=%s\n' "$TRELLIS_RECOVERY_OUTCOME"
          printf 'TRELLIS_PREPARE_OUTCOME=%s\n' "$TRELLIS_PREPARE_OUTCOME"
          printf 'TRELLIS_START_OUTCOME=%s\n' "$TRELLIS_START_OUTCOME"
          printf 'TRELLIS_HEALTH_OUTCOME=%s\n' "$TRELLIS_HEALTH_OUTCOME"
          printf 'TRELLIS_ONLY_GRADIO_OUTCOME=%s\n' "$TRELLIS_ONLY_GRADIO_OUTCOME"
          printf 'TRELLIS_COMBINED_GRADIO_OUTCOME=%s\n' "$TRELLIS_COMBINED_GRADIO_OUTCOME"
          printf 'TRELLIS_PURGE_OUTCOME=%s\n' "$TRELLIS_PURGE_OUTCOME"
          printf 'FLUX_CACHE_OUTCOME=%s\n' "$FLUX_CACHE_OUTCOME"
          printf 'FLUX_START_OUTCOME=%s\n' "$FLUX_START_OUTCOME"
          printf 'FLUX_HEALTH_OUTCOME=%s\n' "$FLUX_HEALTH_OUTCOME"
          printf 'FLUX_GRADIO_OUTCOME=%s\n' "$FLUX_GRADIO_OUTCOME"
          printf 'FLUX_COMBINED_GRADIO_OUTCOME=%s\n' "$FLUX_COMBINED_GRADIO_OUTCOME"
          printf 'FLUX_PURGE_OUTCOME=%s\n' "$FLUX_PURGE_OUTCOME"
          printf 'MUSICGEN_CLI_OUTCOME=%s\n' "$MUSICGEN_CLI_OUTCOME"
          printf 'SPEECH_PREPARE_OUTCOME=%s\n' "$SPEECH_PREPARE_OUTCOME"
          printf 'SPEECH_GRADIO_OUTCOME=%s\n' "$SPEECH_GRADIO_OUTCOME"
          printf 'SPEECH_PURGE_RECOVERY_OUTCOME=%s\n' "$SPEECH_PURGE_RECOVERY_OUTCOME"
          printf 'ACE_PROCESS_RECOVERY_OUTCOME=%s\n' "$ACE_PROCESS_RECOVERY_OUTCOME"
          printf 'LTX_START_OUTCOME=%s\n' "$LTX_START_OUTCOME"
          printf 'LTX_HEALTH_OUTCOME=%s\n' "$LTX_HEALTH_OUTCOME"
          printf 'LTX_TEXT_VIDEO_OUTCOME=%s\n' "$LTX_TEXT_VIDEO_OUTCOME"
          printf 'LTX_IMAGE_VIDEO_OUTCOME=%s\n' "$LTX_IMAGE_VIDEO_OUTCOME"
          printf 'LTX_PURGE_OUTCOME=%s\n' "$LTX_PURGE_OUTCOME"
          printf 'WAN_NOTEBOOK_OUTCOME=%s\n' "$WAN_NOTEBOOK_OUTCOME"
          printf 'WAN_PURGE_OUTCOME=%s\n' "$WAN_PURGE_OUTCOME"
          require_success() {
            local name="$1"
            local outcome="$2"
            printf '%s=%s\n' "$name" "$outcome"
            test "$outcome" = "success"
          }
          require_success CONTRACTS_OUTCOME "$CONTRACTS_OUTCOME"
          if [[ "$RUN_SCOPE_CONTROLS" == "true" ]]; then require_success SAFE_CONTROL_NOTEBOOKS_OUTCOME "$SAFE_CONTROL_NOTEBOOKS_OUTCOME"; fi
          if [[ "$RUN_SCOPE_DEPLOYMENT" == "true" ]]; then require_success DEPLOYMENT_NOTEBOOK_OUTCOME "$DEPLOYMENT_NOTEBOOK_OUTCOME"; fi
          if [[ "$RUN_SCOPE_AUDIOCRAFT_NOTEBOOK" == "true" ]]; then require_success AUDIOGEN_NOTEBOOK_OUTCOME "$AUDIOGEN_NOTEBOOK_OUTCOME"; fi
          if [[ "$RUN_SCOPE_AUDIOGEN" == "true" || "$RUN_SCOPE_MUSICGEN" == "true" ]]; then require_success MUSICGEN_RECOVERY_OUTCOME "$MUSICGEN_RECOVERY_OUTCOME"; fi
          if [[ "$RUN_SCOPE_AUDIOGEN" == "true" ]]; then
            require_success AUDIOGEN_START_OUTCOME "$AUDIOGEN_START_OUTCOME"
            require_success AUDIOGEN_HEALTH_OUTCOME "$AUDIOGEN_HEALTH_OUTCOME"
            require_success AUDIOGEN_GRADIO_OUTCOME "$AUDIOGEN_GRADIO_OUTCOME"
            require_success AUDIOGEN_PURGE_OUTCOME "$AUDIOGEN_PURGE_OUTCOME"
          fi
          if [[ "$RUN_SCOPE_MUSICGEN" == "true" ]]; then
            require_success MUSICGEN_CLI_OUTCOME "$MUSICGEN_CLI_OUTCOME"
            require_success MUSICGEN_START_OUTCOME "$MUSICGEN_START_OUTCOME"
            require_success MUSICGEN_HEALTH_OUTCOME "$MUSICGEN_HEALTH_OUTCOME"
            require_success MUSICGEN_GRADIO_OUTCOME "$MUSICGEN_GRADIO_OUTCOME"
            require_success MUSICGEN_PURGE_OUTCOME "$MUSICGEN_PURGE_OUTCOME"
          fi
          if [[ "$RUN_SCOPE_SPEECH" == "true" ]]; then
            require_success SPEECH_PREPARE_OUTCOME "$SPEECH_PREPARE_OUTCOME"
            require_success SPEECH_GRADIO_OUTCOME "$SPEECH_GRADIO_OUTCOME"
            require_success SPEECH_PURGE_RECOVERY_OUTCOME "$SPEECH_PURGE_RECOVERY_OUTCOME"
          fi
          if [[ "$RUN_SCOPE_ACE_STEP" == "true" ]]; then
            require_success ACE_PREPARE_OUTCOME "$ACE_PREPARE_OUTCOME"
            require_success ACE_GRADIO_OUTCOME "$ACE_GRADIO_OUTCOME"
            require_success ACE_PROCESS_RECOVERY_OUTCOME "$ACE_PROCESS_RECOVERY_OUTCOME"
            require_success ACE_PURGE_OUTCOME "$ACE_PURGE_OUTCOME"
          fi
          if [[ "$RUN_SCOPE_TRELLIS" == "true" ]]; then
            require_success TRELLIS_RECOVERY_OUTCOME "$TRELLIS_RECOVERY_OUTCOME"
            require_success TRELLIS_PREPARE_OUTCOME "$TRELLIS_PREPARE_OUTCOME"
            require_success TRELLIS_START_OUTCOME "$TRELLIS_START_OUTCOME"
            require_success TRELLIS_HEALTH_OUTCOME "$TRELLIS_HEALTH_OUTCOME"
            require_success TRELLIS_ONLY_GRADIO_OUTCOME "$TRELLIS_ONLY_GRADIO_OUTCOME"
            require_success TRELLIS_COMBINED_GRADIO_OUTCOME "$TRELLIS_COMBINED_GRADIO_OUTCOME"
            require_success TRELLIS_PURGE_OUTCOME "$TRELLIS_PURGE_OUTCOME"
          fi
          if [[ "$RUN_SCOPE_FLUX" == "true" ]]; then
            require_success FLUX_CACHE_OUTCOME "$FLUX_CACHE_OUTCOME"
            require_success FLUX_START_OUTCOME "$FLUX_START_OUTCOME"
            require_success FLUX_HEALTH_OUTCOME "$FLUX_HEALTH_OUTCOME"
            require_success FLUX_GRADIO_OUTCOME "$FLUX_GRADIO_OUTCOME"
            require_success FLUX_COMBINED_GRADIO_OUTCOME "$FLUX_COMBINED_GRADIO_OUTCOME"
            require_success FLUX_PURGE_OUTCOME "$FLUX_PURGE_OUTCOME"
          fi
          if [[ "$RUN_SCOPE_LTX" == "true" ]]; then
            require_success LTX_START_OUTCOME "$LTX_START_OUTCOME"
            require_success LTX_HEALTH_OUTCOME "$LTX_HEALTH_OUTCOME"
            require_success LTX_TEXT_VIDEO_OUTCOME "$LTX_TEXT_VIDEO_OUTCOME"
            require_success LTX_IMAGE_VIDEO_OUTCOME "$LTX_IMAGE_VIDEO_OUTCOME"
            require_success LTX_PURGE_OUTCOME "$LTX_PURGE_OUTCOME"
          fi
          if [[ "$RUN_SCOPE_WAN" == "true" ]]; then
            require_success WAN_NOTEBOOK_OUTCOME "$WAN_NOTEBOOK_OUTCOME"
            require_success WAN_PURGE_OUTCOME "$WAN_PURGE_OUTCOME"
          fi
