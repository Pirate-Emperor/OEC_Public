name: OEC targeted model notebook acceptance
run-name: "OEC all-notebook and model-demo acceptance"

on:
  push:
    branches:
      - fix/media-stack-supervision-20261019
    paths:
      - "pipeline_audiocraft.ipynb"
      - "pipeline_audiogen_gradio.ipynb"
      - "pipeline_acestep_gradio.ipynb"
      - "pipeline_flux_only.ipynb"
      - "pipeline_musicgen_gradio.ipynb"
      - "pipeline_trellis_3d.ipynb"
      - "pipeline_trellis_3d_only.ipynb"
      - "pipeline_ltx_video.ipynb"
      - "pipeline_wan_video.ipynb"
      - "Untitled.ipynb"
      - "pipeline_demo_acceptance.ipynb"
      - "phase1_test_compute_node.ipynb"
      - "phase1_test_login_node.ipynb"
      - "oec_deply_install.ipynb"
      - "pipeline_verify_encrypted_hf.ipynb"
      - "phase1_test_compute_node.ipynb"
      - "pipeline_audiogen.py"
      - "pipeline_flux_image.py"
      - "tools/run_audiogen_notebook_smoke.py"
      - "tools/run_gradio_model_notebook_smokes.py"
      - "tools/wait_for_media_service.py"
      - "tools/recover_failed_musicgen_acceptance_service.py"
      - "tools/run_media_model_smokes.py"
      - "tools/audit_notebook_suite.py"
      - "tools/run_wan_notebook_smoke.py"
      - "tools/media_services/model_cache.py"
      - "tools/media_services/trellis_api.py"
      - "tools/media_services/ltx_api.py"
      - "tools/prepare_media_models.py"
      - "tools/prepare_ace_step_runtime.py"
      - "tools/prepare_flux_cache.py"
      - "tools/cleanup_test_model_caches.py"
      - "tools/run_safe_notebook_smokes.py"
      - "tools/media_services/audio_api.py"
      - "tools/media_services/audiocraft_api.py"
      - "tools/media_services/flux_api.py"
      - "tools/oec_service_manager.py"
      - "tests/test_audiocraft_notebook_static.py"
      - "tests/test_gradio_model_notebooks.py"
      - "tests/test_media_service_readiness.py"
      - "tests/test_audio_service_validation.py"
      - "tests/test_flux_image_pipeline.py"
      - "tests/test_oec_service_manager_media.py"
      - "tests/test_media_smoke_process_cleanup.py"
      - "tests/test_prepare_flux_cache.py"
      - "tests/test_storage_write_admission.py"
      - "tests/test_trellis_notebook_static.py"
      - ".github/workflows/oec-demo-notebook-acceptance.yml"
      - ".github/workflows/oec-root-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oec-media-gpu-storage-serial
  cancel-in-progress: false

jobs:
  acceptance:
    name: Run full notebooks and real model-server Gradio callbacks
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-2]
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select model acceptance scope from changed source paths
        id: scope
        run: |
          set -euo pipefail
          scopes=(controls deployment encrypted_hf audiocraft_notebook audiogen musicgen speech ace_step trellis flux ltx wan)
          declare -A run_scope
          for scope_name in "${scopes[@]}"; do run_scope["$scope_name"]=false; done
          full=false
          changed_paths=""
          before_sha="$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8")).get("before", ""))')"

          if [[ "$GITHUB_EVENT_NAME" != "push" || -z "$before_sha" || "$before_sha" =~ ^0+$ ]]; then
            full=true
          elif ! git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
            full=true
          else
            changed_paths="$(git diff --name-only "$before_sha" "$GITHUB_SHA")"
            if [[ -z "$changed_paths" ]]; then full=true; fi
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              case "$path" in
                pipeline_audiocraft.ipynb)
                  run_scope[audiocraft_notebook]=true; run_scope[audiogen]=true ;;
                pipeline_audiogen.py|pipeline_audiogen_gradio.ipynb|tools/run_audiogen_notebook_smoke.py)
                  run_scope[audiogen]=true ;;
                pipeline_musicgen.py|pipeline_musicgen_gradio.ipynb|tools/media_services/audiocraft_api.py|tools/recover_failed_musicgen_acceptance_service.py)
                  run_scope[musicgen]=true ;;
                Untitled.ipynb|pipeline_demo_acceptance.ipynb|phase1_test_compute_node.ipynb|phase1_test_login_node.ipynb)
                  run_scope[controls]=true ;;
                oec_deply_install.ipynb|tools/run_safe_notebook_smokes.py)
                  run_scope[deployment]=true ;;
                pipeline_verify_encrypted_hf.ipynb)
                  run_scope[encrypted_hf]=true ;;
                tools/run_media_model_smokes.py)
                  run_scope[speech]=true; run_scope[ace_step]=true ;;
                pipeline_kokoro_gradio.ipynb|pipeline_whisper_gradio.ipynb|pipeline_qwen3_asr_gradio.ipynb)
                  run_scope[speech]=true ;;
                pipeline_acestep_gradio.ipynb|tools/media_services/audio_api.py|tools/prepare_ace_step_runtime.py)
                  run_scope[ace_step]=true ;;
                pipeline_trellis_3d.ipynb)
                  run_scope[trellis]=true; run_scope[flux]=true ;;
                pipeline_trellis_3d.py|pipeline_trellis_3d_only.ipynb|tools/media_services/trellis_api.py)
                  run_scope[trellis]=true ;;
                pipeline_flux_only.ipynb|pipeline_flux_image.py|tools/media_services/flux_api.py|tools/prepare_flux_cache.py)
                  run_scope[flux]=true ;;
                pipeline_flux_trellis.py|tools/run_flux_pipeline_smoke.py|.github/workflows/oec-flux-pipeline-smoke.yml)
                  run_scope[flux]=true; run_scope[trellis]=true ;;
                tools/run_gradio_model_notebook_smokes.py)
                  run_scope[trellis]=true; run_scope[flux]=true ;;
                pipeline_ltx_video.ipynb|tools/media_services/ltx_api.py|worker_ltx_video.py|tools/wait_for_media_service.py)
                  run_scope[ltx]=true ;;
                tests/test_media_service_readiness.py)
                  run_scope[musicgen]=true; run_scope[ltx]=true ;;
                pipeline_wan_video.ipynb|tools/run_wan_notebook_smoke.py)
                  run_scope[wan]=true ;;
                tools/media_services/common.py|tools/media_services/model_cache.py|tools/oec_service_manager.py|oec_gpu_admission.py|storage_manager.py|storage_policy.py|tools/prepare_media_models.py|tools/prepare_media_runtime.py)
                  full=true ;;
                tests/test_gradio_model_notebooks.py)
                  : ;;
                .github/workflows/oec-demo-notebook-acceptance.yml)
                  # Exercise all model paths whose launch/compatibility checks are changed here.
                  run_scope[audiogen]=true; run_scope[trellis]=true; run_scope[flux]=true; run_scope[ltx]=true; run_scope[wan]=true ;;
                .github/workflows/oec-root-sync.yml|tests/*|docs/*|README*|TODO.md|result.md|*.md)
                  : ;;
                *)
                  full=true ;;
              esac
            done <<< "$changed_paths"
          fi

          if [[ "$full" == true ]]; then
            for scope_name in "${scopes[@]}"; do run_scope["$scope_name"]=true; done
          fi
          echo "ACCEPTANCE_SCOPE_FULL=$full"
          for scope_name in "${scopes[@]}"; do
            printf '%s=%s\n' "$scope_name" "${run_scope[$scope_name]}" >> "$GITHUB_OUTPUT"
            printf 'RUN_SCOPE_%s=%s\n' "${scope_name^^}" "${run_scope[$scope_name]}"
          done
          printf 'CHANGED_PATHS_BEGIN\n%s\nCHANGED_PATHS_END\n' "${changed_paths:-workflow_dispatch/full-run}"

      - name: Validate assigned runner and load live StorageManager configuration
        id: preflight
        run: |
          set -euo pipefail
          CONDA_EXE="$HOME/Conda/condabin/conda"
          OEC_ACCEPTANCE_ROOT="$RUNNER_TEMP/oec-demo-notebook-acceptance-$GITHUB_RUN_ID"
          echo "CONDA_EXE=$CONDA_EXE" >> "$GITHUB_ENV"
          echo "OEC_ACCEPTANCE_ROOT=$OEC_ACCEPTANCE_ROOT" >> "$GITHUB_ENV"
          test "$RUNNER_NAME" = "oec-2"
          test -x "$CONDA_EXE"
          test -f "$HOME/OEC/storage_config.json"
          install -m 600 "$HOME/OEC/storage_config.json" "$GITHUB_WORKSPACE/storage_config.json"
          mkdir -p "$OEC_ACCEPTANCE_ROOT"
          printf 'RUNNER=%s\nHOST=%s\nCOMMIT=%s\n' "$RUNNER_NAME" "$(hostname)" "$GITHUB_SHA" | tee "$OEC_ACCEPTANCE_ROOT/runner.txt"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$OEC_ACCEPTANCE_ROOT/storage-before.log"
          nvidia-smi | tee "$OEC_ACCEPTANCE_ROOT/nvidia-smi-before.txt"

      - name: Compile code and run static contracts in each intended environment
        id: contracts
        continue-on-error: true
        run: |
          set -euo pipefail
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/audit_notebook_suite.py \
            --strict-clean --report-json "$OEC_ACCEPTANCE_ROOT/notebook-audit.json"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m py_compile \
            tools/oec_service_manager.py tools/media_services/audio_api.py tools/media_services/audiocraft_api.py \
            tools/media_services/flux_api.py tools/media_services/trellis_api.py tools/media_services/ltx_api.py \
            tools/media_services/model_cache.py tools/prepare_flux_cache.py tools/cleanup_test_model_caches.py tools/run_safe_notebook_smokes.py tools/audit_notebook_suite.py \
            tools/run_wan_notebook_smoke.py tools/run_gradio_model_notebook_smokes.py tools/run_media_model_smokes.py \
            tools/wait_for_media_service.py tools/recover_failed_musicgen_acceptance_service.py \
            tests/test_gradio_model_notebooks.py tests/test_audio_service_validation.py tests/test_flux_image_pipeline.py \
            tests/test_oec_service_manager_media.py tests/test_media_smoke_process_cleanup.py tests/test_prepare_flux_cache.py \
            tests/test_storage_write_admission.py tests/test_trellis_notebook_static.py
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_gradio_model_notebooks.py' -v
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_media_service_readiness.py' -v
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_audio_service_validation.py' -v
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_flux_image_pipeline.py' -v
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_oec_service_manager_media.py' -v
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_media_smoke_process_cleanup.py' -v
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_prepare_flux_cache.py' -v
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_storage_write_admission.py' -v
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_trellis_notebook_static.py' -v
          "$CONDA_EXE" run --no-capture-output -n phase1 python -m unittest discover -s tests -p 'test_audiocraft_notebook_static.py' -v

      - name: Execute safe control notebooks in their declared Conda environments
        id: safe_control_notebooks
        if: always() && steps.preflight.outcome == 'success' && steps.scope.outputs.controls == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/control-notebooks"
          mkdir -p "$R/base" "$R/compute"
          export OEC_START_HF_UPLOAD_DAEMON=0
          export OEC_TEST_ENABLE_CLOUD_UPLOAD=0
          export OEC_DEPLOY_LAUNCH_BIOME=0
          export OEC_SAFE_NOTEBOOK_SMOKE_DIR="$R/base"
          timeout --signal=INT --kill-after=20s 300s "$CONDA_EXE" run --no-capture-output -n base \
            python tools/run_safe_notebook_smokes.py --notebooks Untitled.ipynb 2>&1 | tee "$R/base/notebook-execution.log"
          export OEC_SAFE_NOTEBOOK_SMOKE_DIR="$R/compute"
          timeout --signal=INT --kill-after=20s 600s "$CONDA_EXE" run --no-capture-output -n phase1_ltx \
            python tools/run_safe_notebook_smokes.py --notebooks pipeline_demo_acceptance.ipynb phase1_test_compute_node.ipynb 2>&1 | tee "$R/compute/notebook-execution.log"

      - name: Execute deployment diagnostics in the oec_deploy environment
        id: deployment_notebook
        if: always() && steps.preflight.outcome == 'success' && steps.scope.outputs.deployment == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/deployment-notebook"
          mkdir -p "$R"
          test -x "$HOME/Conda/envs/oec_deploy/bin/python"
          export OEC_SAFE_NOTEBOOK_SMOKE_DIR="$R"
          export OEC_DEPLOY_LAUNCH_BIOME=0
          timeout --signal=INT --kill-after=20s 600s "$CONDA_EXE" run --no-capture-output -n oec_deploy \
            python tools/run_safe_notebook_smokes.py --notebooks oec_deply_install.ipynb 2>&1 | tee "$R/notebook-execution.log"

      - name: Assess encrypted Hugging Face read-back notebook without credentials
        id: encrypted_hf_preflight
        if: always() && steps.preflight.outcome == 'success' && steps.scope.outputs.encrypted_hf == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/encrypted-hf-preflight"
          mkdir -p "$R"
          export OEC_SAFE_NOTEBOOK_SMOKE_DIR="$R"
          timeout --signal=INT --kill-after=20s 300s "$CONDA_EXE" run --no-capture-output -n base \
            python tools/run_safe_notebook_smokes.py --notebooks pipeline_verify_encrypted_hf.ipynb 2>&1 | tee "$R/notebook-execution.log"

      - name: Recover a known-failed MusicGen service left by a cancelled acceptance run
        id: musicgen_recovery
        if: always() && steps.preflight.outcome == 'success' && (steps.scope.outputs.musicgen == 'true' || steps.scope.outputs.audiogen == 'true')
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/musicgen-gradio"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/recover_failed_musicgen_acceptance_service.py 2>&1 | tee "$R/service-recovery.log"

      - name: Execute AudioCraft notebook top-to-bottom and generate a WAV
        if: always() && steps.preflight.outcome == 'success' && steps.scope.outputs.audiocraft_notebook == 'true' && steps.musicgen_recovery.outcome == 'success'
        id: audiogen_full_notebook
        continue-on-error: true
        run: |
          set -euo pipefail
          OEC_AUDIOGEN_SMOKE_DIR="$OEC_ACCEPTANCE_ROOT/audiogen-full-notebook"
          mkdir -p "$OEC_AUDIOGEN_SMOKE_DIR"
          export OEC_AUDIOGEN_HEADLESS_SMOKE=1
          export OEC_AUDIOGEN_SMOKE_DIR
          export GRADIO_ANALYTICS_ENABLED="False"
          timeout --signal=INT --kill-after=20s 1800s "$CONDA_EXE" run --no-capture-output -n phase1 \
            python tools/run_audiogen_notebook_smoke.py 2>&1 | tee "$OEC_AUDIOGEN_SMOKE_DIR/notebook-execution.log"

      - name: Start the AudioGen server on an admitted idle A100
        if: always() && steps.preflight.outcome == 'success' && steps.scope.outputs.audiogen == 'true' && steps.musicgen_recovery.outcome == 'success'
        id: audiogen_start
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/audiogen-gradio"
          mkdir -p "$R"
          GPU="$("$CONDA_EXE" run --no-capture-output -n phase2_3d python -c 'from oec_gpu_admission import select_idle_a100_gpu; print(select_idle_a100_gpu(caller="AUDIOGEN_NOTEBOOK_ACCEPTANCE")["index"])' | tail -n 1)"
          echo "AUDIOGEN_PHYSICAL_GPU=$GPU" | tee "$R/gpu.txt"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py start audiocraft-api \
            --provider audiogen --gpu "$GPU" --port 7874 --allow-download --accept-noncommercial-license 2>&1 | tee "$R/service-start.log"

      - name: Wait for AudioGen model server readiness
        id: audiogen_health
        if: always() && steps.audiogen_start.outcome == 'success' && steps.scope.outputs.audiogen == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/audiogen-gradio"
          HEALTH_CODE='import json, urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); health=json.load(opener.open("http://127.0.0.1:7874/health", timeout=3)); assert not health.get("error") or health.get("loading", False), "fatal model load error: " + str(health.get("error")); assert health.get("ready") and health.get("model_loaded"), health; print(json.dumps(health))'
          ready=0
          for _ in $(seq 1 240); do
            if "$HOME/Conda/envs/phase2_3d/bin/python" -c "$HEALTH_CODE" >"$R/health-check.log" 2>&1; then ready=1; break; fi
            sleep 5
          done
          cat "$R/health-check.log"
          test "$ready" -eq 1

      - name: Launch AudioGen Gradio UI and submit a real server inference
        id: audiogen_gradio
        if: always() && steps.audiogen_health.outcome == 'success' && steps.scope.outputs.audiogen == 'true'
        continue-on-error: true
        env:
          OEC_MEDIA_API_URL: "http://127.0.0.1:7874"
          OEC_GRADIO_HEADLESS_SMOKE: "1"
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/audiogen-gradio"
          mkdir -p "$R"
          timeout --signal=INT --kill-after=20s 1800s "$CONDA_EXE" run --no-capture-output -n phase1 \
            python tools/run_gradio_model_notebook_smokes.py --provider audiogen --report-dir "$R" 2>&1 | tee "$R/gradio-callback.log"

      - name: Stop the managed AudioGen service
        if: always() && steps.scope.outputs.audiogen == 'true'
        run: |
          set +e
          mkdir -p "$OEC_ACCEPTANCE_ROOT/audiogen-gradio"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py logs audiocraft-api --tail 100 >"$OEC_ACCEPTANCE_ROOT/audiogen-gradio/service-final.log" 2>&1
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py stop audiocraft-api --grace-seconds 25 >>"$OEC_ACCEPTANCE_ROOT/audiogen-gradio/service-final.log" 2>&1
          exit 0

      - name: Purge AudioGen cache after the service is stopped
        id: audiogen_purge
        if: always() && steps.preflight.outcome == 'success' && steps.scope.outputs.audiogen == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/audiogen-gradio"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/cleanup_test_model_caches.py --models audiogen-medium --report-json "$R/cache-cleanup.json" 2>&1 | tee "$R/cache-cleanup.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/model_cache_manager.py status 2>&1 | tee -a "$OEC_ACCEPTANCE_ROOT/audiogen-gradio/cache-cleanup.log"



      - name: Test standalone MusicGen CLI mode and decode its WAV
        id: musicgen_cli
        if: always() && steps.preflight.outcome == 'success' && steps.scope.outputs.musicgen == 'true' && steps.musicgen_recovery.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/musicgen-cli"
          mkdir -p "$R"
          OUT="/tmp/oec-musicgen-acceptance-$GITHUB_RUN_ID.wav"
          METADATA="${OUT%.wav}.info.json"
          timeout --signal=INT --kill-after=30s 1800s "$CONDA_EXE" run --no-capture-output -n phase1 \
            python pipeline_musicgen.py --mode generate --allow-download --scratch-output \
            --output "$OUT" --duration 3 --seed 42 \
            --prompt "A short calm instrumental cue, warm piano and mellow strings" 2>&1 | tee "$R/model-generation.log"
          "$CONDA_EXE" run --no-capture-output -n phase1 python -c 'import soundfile,sys; x=soundfile.info(sys.argv[1]); print("MUSICGEN_CLI_WAV=PASS",x); assert x.frames>0 and x.samplerate>0 and x.channels>0 and x.duration>0' "$OUT"
          cp "$OUT" "$R/musicgen-direct.wav"
          cp "$METADATA" "$R/musicgen-direct.info.json"
          sha256sum "$R/musicgen-direct.wav" | tee "$R/artifact.sha256"
          rm -f "$OUT" "$METADATA"

      - name: Start the MusicGen server on an admitted idle A100
        id: musicgen_start
        if: always() && steps.preflight.outcome == 'success' && steps.scope.outputs.musicgen == 'true' && steps.musicgen_recovery.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/musicgen-gradio"
          mkdir -p "$R"
          GPU="$("$CONDA_EXE" run --no-capture-output -n phase2_3d python -c 'from oec_gpu_admission import select_idle_a100_gpu; print(select_idle_a100_gpu(caller="MUSICGEN_NOTEBOOK_ACCEPTANCE")["index"])' | tail -n 1)"
          echo "MUSICGEN_PHYSICAL_GPU=$GPU" | tee "$R/gpu.txt"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py start audiocraft-api \
            --provider musicgen --gpu "$GPU" --port 7875 --allow-download --accept-noncommercial-license 2>&1 | tee "$R/service-start.log"

      - name: Wait for MusicGen model server readiness
        id: musicgen_health
        if: always() && steps.musicgen_start.outcome == 'success' && steps.scope.outputs.musicgen == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/musicgen-gradio"
          HEALTH_CODE='import json, urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); health=json.load(opener.open("http://127.0.0.1:7875/health", timeout=3)); assert not health.get("error") or health.get("loading", False), "fatal model load error: " + str(health.get("error")); assert health.get("ready") and health.get("model_loaded"), health; print(json.dumps(health))'
          ready=0
          for _ in $(seq 1 240); do
            if "$HOME/Conda/envs/phase2_3d/bin/python" -c "$HEALTH_CODE" >"$R/health-check.log" 2>&1; then ready=1; break; fi
            sleep 5
          done
          cat "$R/health-check.log"
          test "$ready" -eq 1

      - name: Launch MusicGen Gradio UI and generate real music
        id: musicgen_gradio
        if: always() && steps.musicgen_health.outcome == 'success' && steps.scope.outputs.musicgen == 'true'
        continue-on-error: true
        env:
          OEC_MEDIA_API_URL: "http://127.0.0.1:7875"
          OEC_GRADIO_HEADLESS_SMOKE: "1"
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/musicgen-gradio"
          timeout --signal=INT --kill-after=20s 1800s "$CONDA_EXE" run --no-capture-output -n phase1 \
            python tools/run_gradio_model_notebook_smokes.py --provider musicgen --report-dir "$R" 2>&1 | tee "$R/gradio-callback.log"

      - name: Stop the managed MusicGen service
        if: always() && steps.scope.outputs.musicgen == 'true'
        run: |
          set +e
          R="$OEC_ACCEPTANCE_ROOT/musicgen-gradio"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py logs audiocraft-api --tail 120 >"$R/service-final.log" 2>&1
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/oec_service_manager.py stop audiocraft-api --grace-seconds 25 >>"$R/service-final.log" 2>&1
          exit 0

      - name: Purge MusicGen cache after the service is stopped
        id: musicgen_purge
        if: always() && steps.preflight.outcome == 'success' && steps.scope.outputs.musicgen == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/musicgen-gradio"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/cleanup_test_model_caches.py --models musicgen-medium --report-json "$R/cache-cleanup.json" 2>&1 | tee "$R/cache-cleanup.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/model_cache_manager.py status 2>&1 | tee -a "$OEC_ACCEPTANCE_ROOT/musicgen-gradio/cache-cleanup.log"

      - name: Prepare speech checkpoints and isolated runtime
        id: speech_prepare
        if: always() && steps.preflight.outcome == 'success' && steps.scope.outputs.speech == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/speech"
          mkdir -p "$R"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-before.log"
          for model in kokoro whisper-turbo qwen3-asr-0.6b; do
            "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/prepare_media_models.py download --model "$model" 2>&1 | tee -a "$R/checkpoint-preparation.log"
          done
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/prepare_media_runtime.py 2>&1 | tee "$R/runtime-setup.log"

      - name: Run Kokoro, Whisper and Qwen3-ASR Gradio modes and purge each tested cache
        id: speech_gradio
        if: always() && steps.speech_prepare.outcome == 'success' && steps.scope.outputs.speech == 'true'
        continue-on-error: true
        env:
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/speech"
          mkdir -p "$R"
          set +e
          timeout --signal=INT --kill-after=30s 3600s "$CONDA_EXE" run --no-capture-output -n phase2_3d \
            python tools/run_media_model_smokes.py --providers kokoro,whisper,qwen3-asr \
            --check-gradio-notebooks --purge-after --require-pass 2>&1 | tee "$R/speech-gradio-acceptance.log"
          smoke_rc=${PIPESTATUS[0]}
          set -e
          for report in kokoro whisper qwen3-asr; do
            for suffix in service smoke; do
              src="$RUNNER_TEMP/oec-media-smoke-logs/$report-$suffix.log"
              if [[ -f "$src" ]]; then cp "$src" "$R/"; fi
            done
            src="$RUNNER_TEMP/oec-media-smoke-logs/$report-gradio-notebook-smoke.json"
            if [[ -f "$src" ]]; then cp "$src" "$R/"; fi
          done
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/cleanup_test_model_caches.py \
            --models kokoro,whisper-turbo,qwen3-asr-0.6b --report-json "$R/cache-cleanup.json" 2>&1 | tee "$R/cache-cleanup.log"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python tools/model_cache_manager.py status 2>&1 | tee "$R/cache-status-after.log"
          exit "$smoke_rc"

      - name: Recover timed-out speech backends and purge their caches safely
        id: speech_purge_recovery
        if: always() && steps.preflight.outcome == 'success' && steps.scope.outputs.speech == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
