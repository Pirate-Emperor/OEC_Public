          "$CONDA_EXE" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-after-cleanup.log"

      - name: Recover a managed TRELLIS service left by a cancelled acceptance
        id: trellis_orphan_recovery
        if: always() && steps.preflight.outcome == 'success' && steps.scope.outputs.trellis == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          R="$OEC_ACCEPTANCE_ROOT/trellis"
