      - name: Exercise combined TRELLIS/FLUX notebook TRELLIS callback and validate GLB
        id: trellis_combined_gradio
        if: always() && steps.trellis_health.outcome == 'success' && steps.scope.outputs.trellis == 'true'
        continue-on-error: true
        env:
          OEC_MEDIA_API_URL: "http://127.0.0.1:7868"
          OEC_TRELLIS_API_URL: "http://127.0.0.1:7868"
          OEC_GRADIO_HEADLESS_SMOKE: "1"
          GRADIO_ANALYTICS_ENABLED: "False"
        run: |
