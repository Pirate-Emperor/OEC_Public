name: Enforce local self-hosted GitHub Actions runners

on:
  push:
    paths:
      - ".github/workflows/**"
      - "AGENTS.md"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-runner-policy:
    name: Reject GitHub-hosted runner selectors
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Check out workflow definitions
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify every job targets a local runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          workflow_root = Path(".github/workflows")
          violations = []

          for path in sorted(workflow_root.rglob("*")):
              if path.suffix.lower() not in {".yml", ".yaml"}:
                  continue
              for line_number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  stripped = line.lstrip()
                  if not stripped.lower().startswith("runs-on:"):
                      continue
                  value = stripped.partition(":")[2].split("#", 1)[0].strip().lower()
                  hosted_selector = any(token in value for token in ("ubuntu", "windows", "macos"))
                  if "self-hosted" not in value or hosted_selector:
                      violations.append(f"{path}:{line_number}: {value or '<empty runs-on>'}")

          if violations:
              print("GitHub-hosted or non-self-hosted runner selectors are forbidden:")
              for violation in violations:
                  print(violation)
              sys.exit(1)

          print("Runner policy passed: every workflow job explicitly targets self-hosted runners.")
          PY
