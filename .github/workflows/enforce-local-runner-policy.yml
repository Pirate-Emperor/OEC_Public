name: Enforce local self-hosted GitHub Actions runners

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "AGENTS.md"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-runner-policy:
    name: Reject GitHub-hosted runner selectors
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - name: Check out workflow definitions
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify every job targets a local runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          workflow_root = Path(".github/workflows")
          hosted_label = re.compile(r"\\b(ubuntu|windows|macos)(?:-[A-Za-z0-9._]+)?\\b", re.IGNORECASE)
          selector = re.compile(r"^\\s*runs-on\\s*:\\s*(.*?)\\s*$")
          violations = []

          for path in sorted(workflow_root.rglob("*")):
              if path.suffix.lower() not in {".yml", ".yaml"}:
                  continue
              for line_number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  match = selector.match(line)
                  if not match:
                      continue
                  value = match.group(1).split("#", 1)[0].strip()
                  if "self-hosted" not in value.lower() or hosted_label.search(value):
                      violations.append(f"{path}:{line_number}: {value or '<empty runs-on>'}")

          if violations:
              print("GitHub-hosted or non-self-hosted runner selectors are forbidden:")
              print("\\n".join(violations))
              sys.exit(1)

          print("Runner policy passed: every workflow job explicitly targets self-hosted runners.")
          PY
