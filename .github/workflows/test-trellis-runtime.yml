name: TRELLIS Offline Image-to-3D Smoke Test

on:
  push:
    branches:
      - fix/trellis-extension-detection-and-safe-purge-20261010

concurrency:
  group: trellis-offline-runtime-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    name: Generate a synthetic 3D asset from local TRELLIS cache
    runs-on: [self-hosted, connector-3]
    timeout-minutes: 45
    steps:
      - name: Checkout TRELLIS fix branch
        uses: actions/checkout@v4

      - name: Verify local scratch, model cache, and phase2_3d environment
        id: preflight
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          echo "run_smoke=false" >> "$GITHUB_OUTPUT"
          ENVROOT="$HOME/Conda/envs/phase2_3d"
          if [ ! -x "$ENVROOT/bin/python" ] || [ ! -d "$HOME/aireos_models/TRELLIS.2" ]; then
            echo "TRELLIS_RUNTIME_SMOKE=SKIPPED_ENV_OR_REPO_MISSING"
            exit 0
          fi
          if [ ! -d "$HOME/aireos_models/hub/models--microsoft--TRELLIS.2-4B" ]; then
            echo "TRELLIS_RUNTIME_SMOKE=SKIPPED_NO_LOCAL_MODEL_CACHE"
            exit 0
          fi
          SCRATCH_ROOT="/tmp"
          SCRATCH_TYPE="$(df -PT "$SCRATCH_ROOT" | awk 'NR==2 {print $2}')"
          HOME_TYPE="$(df -PT "$HOME" | awk 'NR==2 {print $2}')"
          SCRATCH_SOURCE="$(df -P "$SCRATCH_ROOT" | awk 'NR==2 {print $1}')"
          HOME_SOURCE="$(df -P "$HOME" | awk 'NR==2 {print $1}')"
          echo "SCRATCH_TYPE=$SCRATCH_TYPE HOME_TYPE=$HOME_TYPE"
          echo "SCRATCH_SOURCE=$SCRATCH_SOURCE HOME_SOURCE=$HOME_SOURCE"
          if [[ "$SCRATCH_TYPE" == *lustre* || "$SCRATCH_SOURCE" == "$HOME_SOURCE" ]]; then
            echo "TRELLIS_RUNTIME_SMOKE=SKIPPED_NO_NODE_LOCAL_SCRATCH"
            exit 0
          fi
          AVAILABLE_KB="$(df -Pk "$SCRATCH_ROOT" | awk 'NR==2 {print $4}')"
          if [ -z "$AVAILABLE_KB" ] || [ "$AVAILABLE_KB" -lt 2097152 ]; then
            echo "TRELLIS_RUNTIME_SMOKE=SKIPPED_SCRATCH_BELOW_2_GIB"
            exit 0
          fi
          "$ENVROOT/bin/python" - <<'PY'
          import sys
          from pathlib import Path
          assert sys.version_info[:2] == (3, 10), sys.version
          import torch
          assert torch.__version__.startswith("2.6.0"), torch.__version__
          assert torch.version.cuda == "12.4", torch.version.cuda
          assert torch.cuda.is_available(), "CUDA unavailable"
          print(f"PYTHON={sys.executable}")
          print(f"TORCH={torch.__version__} CUDA={torch.version.cuda}")
          print(f"GPU_COUNT={torch.cuda.device_count()}")
          print("PHASE2_3D_RUNTIME_PREFLIGHT=PASS")
          PY
          echo "run_smoke=true" >> "$GITHUB_OUTPUT"

      - name: Run offline synthetic-image TRELLIS generation
        if: steps.preflight.outputs.run_smoke == 'true'
        shell: bash
        timeout-minutes: 40
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          ENVROOT="$HOME/Conda/envs/phase2_3d"
          GPU_ID="$(nvidia-smi --query-gpu=index,name,memory.used,memory.total --format=csv,noheader,nounits |
            awk -F', ' '$2 ~ /A100/ {free=$4-$3; if (free>best) {best=free; id=$1}} END {if (id!="") print id}')"
          if [ -z "$GPU_ID" ]; then
            echo "TRELLIS_RUNTIME_SMOKE=SKIPPED_NO_A100"
            exit 0
          fi
          export CUDA_VISIBLE_DEVICES="$GPU_ID"
          SCRATCH_DIR="$(mktemp -d /tmp/trellis-runtime-smoke.XXXXXX)"
          trap 'rm -rf "$SCRATCH_DIR"; if [ -e "$SCRATCH_DIR" ]; then echo "TRELLIS_RUNTIME_SCRATCH_CLEANUP=FAIL"; else echo "TRELLIS_RUNTIME_SCRATCH_CLEANUP=PASS"; fi' EXIT
          export TRELLIS_SMOKE_DIR="$SCRATCH_DIR"
          echo "SELECTED_A100_INDEX=$GPU_ID"
          echo "TRELLIS_SMOKE_DIR=$SCRATCH_DIR"
          timeout 35m "$ENVROOT/bin/python" tests/trellis_runtime_smoke.py

