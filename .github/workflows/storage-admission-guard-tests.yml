name: OEC storage write-admission guard tests

on:
  push:
    paths-ignore:
      - 'TODO.md'
      - 'result.md'
      - 'test.json'
      - 'changelog/**'
      - 'docs/**'
    branches:
      - main
      - 'fix/storage-admission-write-guards-20261014'
      - 'feat/quota-aware-reserve-management-20261017'
      - 'fix/media-stack-supervision-20261019'

permissions:
  contents: read

jobs:
  static-write-guard-regressions:
    name: Static notebook, CLI and storage-admission regressions
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-1]
    timeout-minutes: 15
    steps:
      - name: Checkout isolated candidate branch
        uses: actions/checkout@v4
      - name: Validate existing Conda environment and trusted StorageManager config
        run: |
          set -euo pipefail
          CONDA_EXE="$HOME/Conda/condabin/conda"
          test -x "$CONDA_EXE"
          test -f "$HOME/OEC/storage_config.json"
          install -m 600 "$HOME/OEC/storage_config.json" "$GITHUB_WORKSPACE/storage_config.json"
          "$CONDA_EXE" run --no-capture-output -n phase2_3d python -c 'import sys, IPython, huggingface_hub; print("ENV=phase2_3d PYTHON="+sys.version.split()[0]); print("IPYTHON="+IPython.__version__); print("HF_HUB="+huggingface_hub.__version__)'
      - name: Run notebook, CLI and admission tests
        shell: bash
        run: |
          set -euo pipefail
          CONDA_EXE="$HOME/Conda/condabin/conda"
          python() { "$CONDA_EXE" run --no-capture-output -n phase2_3d python "$@"; }
          python -m unittest discover -s tests -p 'test_trellis_notebook_static.py' -v
          python -m unittest discover -s tests -p 'test_trellis_easy_run.py' -v
          python -m unittest discover -s tests -p 'test_flux_trellis_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_audiocraft_notebook_static.py' -v
          python -m unittest discover -s tests -p 'test_storage_write_admission.py' -v
          python -m unittest discover -s tests -p 'test_inference_storage_integration.py' -v
          python -m unittest discover -s tests -p 'test_brain_ltx_queue_storage.py' -v
          python -m unittest discover -s tests -p 'test_upload_status_contract.py' -v
          python -m unittest discover -s tests -p 'test_upload_daemon_storage.py' -v
          python -m unittest discover -s tests -p 'test_oec_e2e_acceptance_contract.py' -v
          python -m unittest discover -s tests -p 'test_gradio_model_notebooks.py' -v
          python -m unittest discover -s tests -p 'test_media_smoke_process_cleanup.py' -v
          python -m unittest discover -s tests -p 'test_prepare_flux_cache.py' -v
          python -m unittest discover -s tests -p 'test_media_service_readiness.py' -v
          python -m unittest discover -s tests -p 'test_ace_step_runtime.py' -v
          python -m unittest discover -s tests -p 'test_oec_service_manager_media.py' -v
          python -m unittest discover -s tests -p 'test_gpu_admission.py' -v
          python -m py_compile oec_gpu_admission.py pipeline_flux_image.py pipeline_flux_trellis.py tests/test_flux_trellis_pipeline.py tools/run_media_model_smokes.py tools/run_oec_e2e_acceptance.py qa_compliance_worker.py tests/test_gpu_admission.py tests/test_inference_storage_integration.py
          python -m py_compile tools/check_media_service_readiness.py tools/oec_service_manager.py tools/prepare_ace_step_runtime.py tests/test_media_service_readiness.py tests/test_oec_service_manager_media.py tests/test_ace_step_runtime.py
          python -m py_compile hf_upload_daemon.py tests/test_upload_daemon_storage.py
          python -m py_compile tools/run_oec_e2e_acceptance.py tests/test_oec_e2e_acceptance_contract.py
          python -m py_compile brain.py tests/test_brain_ltx_queue_storage.py
          python -m unittest discover -s tests -p 'test_storage_manager.py' -v
          python -m unittest discover -s tests -p 'test_storage_policy.py' -v
          python -m unittest discover -s tests -p 'test_quota_snapshot.py' -v
          python -m unittest discover -s tests -p 'test_storage_reservation.py' -v
          python -m py_compile pipeline_trellis_3d.py storage_manager.py storage_policy.py storage_reservation.py tools/quota_snapshot.py tools/recover_dead_storage_locks.py tools/prepare_flux_cache.py
          python - <<'PY'
          import json
          from pathlib import Path
          for name in (
              "pipeline_trellis_3d.ipynb",
              "pipeline_trellis_3d_only.ipynb",
              "pipeline_flux_only.ipynb",
              "pipeline_audiocraft.ipynb",
          ):
              notebook = json.loads(Path(name).read_text(encoding="utf-8"))
              assert notebook.get("nbformat") == 4, name
              print(f"NOTEBOOK_JSON=PASS {name} cells={len(notebook['cells'])}")
          PY
