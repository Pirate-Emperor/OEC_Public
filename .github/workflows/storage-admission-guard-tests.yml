name: OEC storage write-admission guard tests

on:
  pull_request:
    branches:
      - main
  push:
    paths-ignore:
      - 'TODO.md'
      - '.github/flux-trellis.trigger'
      - 'result.md'
      - 'test.json'
      - 'changelog/**'
      - 'docs/**'
    branches:
      - main
      - 'fix/storage-admission-write-guards-20261014'
      - 'fix/trellis-offline-pipeline-config-20261014'
      - 'fix/flux-trellis-pipeline-20261015'

permissions:
  contents: read

jobs:
  static-write-guard-regressions:
    name: Static notebook, CLI and storage-admission regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated candidate branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight notebook test dependency
        run: python -m pip install ipython
      - name: Run notebook, CLI and admission tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_trellis_notebook_static.py' -v
          python -m unittest discover -s tests -p 'test_trellis_easy_run.py' -v
          python -m unittest discover -s tests -p 'test_trellis_offline_config.py' -v
          python -m unittest discover -s tests -p 'test_flux_trellis_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_flux_image.py' -v
          python -m unittest discover -s tests -p 'test_flux_gpu_admission.py' -v
          python -m unittest discover -s tests -p 'test_audiocraft_notebook_static.py' -v
          python -m unittest discover -s tests -p 'test_storage_write_admission.py' -v
          python -m unittest discover -s tests -p 'test_ltx_worker_config.py' -v
          python -m unittest discover -s tests -p 'test_oec_service_manager.py' -v
          python -m py_compile pipeline_trellis_3d.py pipeline_flux_image.py pipeline_flux_trellis.py storage_manager.py worker_ltx_video.py qa_compliance_worker.py tools/oec_service_manager.py tools/ltx_worker_config.py tools/trellis_offline.py tools/oec_runner_probe.py tools/flux_gpu_admission.py
          python - <<'PY'
          import json
          from pathlib import Path
          for name in (
              "pipeline_trellis_3d.ipynb",
              "pipeline_trellis_3d_only.ipynb",
              "pipeline_flux_only.ipynb",
              "pipeline_audiocraft.ipynb",
          ):
              notebook = json.loads(Path(name).read_text(encoding="utf-8"))
              assert notebook.get("nbformat") == 4, name
              print(f"NOTEBOOK_JSON=PASS {name} cells={len(notebook['cells'])}")
          PY
