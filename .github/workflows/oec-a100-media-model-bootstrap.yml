name: OEC A100 model download and live smoke

run-name: "OEC A100 model bootstrap - ${{ github.ref_name }}"

on:
  push:
    branches:
      - feat/media-service-sidecars-20261018
    paths:
      # Model bootstrap is expensive and shares the A100/storage lane. Keep QA,
      # upload/status and workflow-file-only edits on CPU contract CI; trigger this
      # only for model/runtime/cache/storage changes that need real model acceptance.
      - "tools/prepare_media_models.py"
      - "tools/prepare_ace_step_runtime.py"
      - "tools/prepare_media_runtime.py"
      - "tools/storage_reserve_probe.py"
      - "tools/recover_dead_storage_locks.py"
      - "tests/test_storage_reserve_probe.py"
      - "tests/test_prepare_media_runtime.py"
      - "tests/test_prepare_media_models_capacity.py"
      - "tests/test_recover_dead_storage_locks.py"
      - "tools/oec_service_manager.py"
      - "worker_ltx_video.py"
      - "tests/test_oec_service_manager_media.py"
      - "tools/run_media_model_smokes.py"
      - "oec_gpu_admission.py"
      - "tests/test_ace_step_runtime.py"
      - "tools/media_services/**"
      - "tools/model_cache_manager.py"
      - "core_config.py"
      - "storage_manager.py"
      - "storage_policy.py"
      - "storage_config.json"
      - "tests/test_audio_service_validation.py"
      - "tests/test_media_service_api.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared oec-2 GPU and StorageManager state: serialize all media jobs.
  group: oec-media-gpu-storage-serial
  cancel-in-progress: false

jobs:
  inspect-download-smoke:
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-2]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout OEC feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select existing Python with StorageManager and Hugging Face tools
        run: |
          set -euo pipefail
          if [[ -f "$HOME/Conda/bin/activate" ]]; then
            source "$HOME/Conda/bin/activate"
          elif [[ -f "$HOME/Conda/etc/profile.d/conda.sh" ]]; then
            source "$HOME/Conda/etc/profile.d/conda.sh"
          fi
          if ! command -v conda >/dev/null 2>&1; then
            echo "::error::Conda was not found. No installs or downloads were attempted."
            exit 2
          fi
          if [[ ! -f "$HOME/OEC/storage_config.json" ]]; then
            echo "::error::Could not find $HOME/OEC/storage_config.json; no model write is allowed."
            exit 2
          fi
          install -m 600 "$HOME/OEC/storage_config.json" "$GITHUB_WORKSPACE/storage_config.json"
          selected=""
          for name in oec_deploy phase1 phase1_ltx phase2_3d; do
            py="$(conda run --no-capture-output -n "$name" python -c 'import sys; print(sys.executable)' 2>/dev/null | tail -n 1 || true)"
            if [[ -z "$py" || ! -x "$py" ]]; then continue; fi
            if "$py" -c 'import huggingface_hub, core_config; from storage_manager import storage_preflight, managed_storage_operation' >/dev/null 2>&1; then
              selected="$py"
              echo "SELECTED_ENV=$name"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo "::error::No existing Conda environment can import OEC StorageManager and huggingface_hub. No installs or model downloads were attempted."
            exit 2
          fi
          echo "OEC_PYTHON=$selected" >> "$GITHUB_ENV"
          "$selected" --version
          test "${RUNNER_NAME:-unknown}" = "oec-2" || { echo "::error::Expected oec-2 A100 runner, got ${RUNNER_NAME:-unknown}"; exit 52; }
          echo "Runner host: $(hostname)"
          echo "Runner name: $RUNNER_NAME"
          echo "Python: $selected"
          nvidia-smi

      - name: Compile and run CPU/mock regressions before any storage writes
        run: |
          set -euo pipefail
          "$OEC_PYTHON" -m py_compile tools/prepare_media_models.py tools/prepare_ace_step_runtime.py tools/prepare_media_runtime.py tools/storage_reserve_probe.py tools/recover_dead_storage_locks.py tools/run_media_model_smokes.py tools/media_services/common.py tools/media_services/model_cache.py tools/media_services/audio_api.py tools/media_services/smoke_client.py tools/model_cache_manager.py tests/test_media_service_api.py tests/test_audio_service_validation.py tests/test_oec_service_manager_media.py tests/test_upload_status_contract.py tests/test_ace_step_runtime.py tests/test_storage_reserve_probe.py tests/test_prepare_media_runtime.py tests/test_prepare_media_models_capacity.py tests/test_recover_dead_storage_locks.py
          "$OEC_PYTHON" -m unittest discover -s tests -p 'test_media_service_api.py' -v
          "$OEC_PYTHON" -m unittest discover -s tests -p 'test_audio_service_validation.py' -v
          "$OEC_PYTHON" -m unittest discover -s tests -p 'test_oec_service_manager_media.py' -v
          "$OEC_PYTHON" -m unittest discover -s tests -p 'test_upload_status_contract.py' -v
          "$OEC_PYTHON" -m unittest discover -s tests -p 'test_ace_step_runtime.py' -v
          "$OEC_PYTHON" -m unittest discover -s tests -p 'test_storage_reserve_probe.py' -v
          "$OEC_PYTHON" -m unittest discover -s tests -p 'test_prepare_media_runtime.py' -v
          "$OEC_PYTHON" -m unittest discover -s tests -p 'test_prepare_media_models_capacity.py' -v
          "$OEC_PYTHON" -m unittest discover -s tests -p 'test_recover_dead_storage_locks.py' -v

      - name: Read current StorageManager status, log tail and cached models
        run: |
          set -euo pipefail
          "$OEC_PYTHON" tools/prepare_media_models.py status

      - name: Recover expired plain pause locks via StorageManager only
        run: |
          set -euo pipefail
          # --clean only removes expired plain pause-lock files; it preserves reserves and lease manifests.
          "$OEC_PYTHON" storage_manager.py --clean
          "$OEC_PYTHON" tools/recover_dead_storage_locks.py outputs
          "$OEC_PYTHON" storage_manager.py --status

      - name: Audit existing inference environments without installing packages
        run: |
          set +e
          "$OEC_PYTHON" tools/prepare_media_models.py env-audit
          rc=$?
          echo "ENV_AUDIT_EXIT_CODE=$rc"
          exit 0

      - name: Download speech checkpoint groups sequentially with strict live admission
        run: |
          set -euo pipefail
          # The downloader checks cache completeness first; missing weights must pass fresh quota admission.
          for model in kokoro whisper-turbo qwen3-asr-0.6b; do
            echo "SPEECH_MODEL_START=$model"
            "$OEC_PYTHON" tools/prepare_media_models.py download --model "$model"
            echo "SPEECH_MODEL_FINISH=$model"
          done

      - name: Admit isolated speech runtime dependency setup
        if: success()
        run: |
          set -euo pipefail
          "$OEC_PYTHON" -c 'from storage_manager import storage_preflight; ok, reason = storage_preflight("models", required_gb=1.5, require_fresh_quota=True, minimum_free_gb=2.0); print("AUDIO_RUNTIME_STORAGE_ADMISSION=" + str(bool(ok)) + " reason=" + str(reason)); raise SystemExit(0 if ok else 2)'

      - name: Prepare isolated speech runtime and verify output reserve
        if: success()
        run: |
          set -euo pipefail
          "$OEC_PYTHON" tools/prepare_media_runtime.py

      - name: Run live speech inference smoke jobs
        if: success()
        run: |
          set -euo pipefail
          "$OEC_PYTHON" tools/run_media_model_smokes.py --providers kokoro,whisper,qwen3-asr

      - name: Download ACE-Step checkpoint groups into AIEROS_MODELS through StorageManager
        if: success()
        run: |
          set -euo pipefail
          "$OEC_PYTHON" tools/prepare_media_models.py download --model ace-step-main
          "$OEC_PYTHON" tools/prepare_media_models.py download --model ace-step-lm-0.6b

      - name: Prepare pinned ACE-Step in its own Python/Torch environment
        if: success()
        run: |
          set -euo pipefail
          # ACE-Step requires a Python 3.11–3.12 interpreter. The generic storage helper
          # may select an older (e.g. Python 3.9) Conda environment, so select a compatible
          # existing interpreter explicitly rather than installing/upgrading shared Conda.
          ACE_BASE_PYTHON=""
          for candidate in \
            "$HOME/Conda/envs/oec_deploy/bin/python" \
            "$HOME/Conda/envs/phase1_ltx/bin/python" \
            "$HOME/Conda/envs/phase2_3d/bin/python" \
            "$HOME/Conda/envs/phase1/bin/python"; do
            [[ -x "$candidate" ]] || continue
            version="$("$candidate" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")' 2>/dev/null || true)"
            case "$version" in
              3.11|3.12)
                ACE_BASE_PYTHON="$candidate"
                echo "ACE_STEP_BOOTSTRAP_PYTHON=$candidate"
                echo "ACE_STEP_BOOTSTRAP_PYTHON_VERSION=$version"
                break
                ;;
            esac
          done
          if [[ -z "$ACE_BASE_PYTHON" ]]; then
            echo "::error::ACE-Step requires an existing Python 3.11–3.12 interpreter; no compatible Conda environment was found. No shared environment was modified."
            exit 2
          fi
          "$ACE_BASE_PYTHON" -c 'import sys; assert (3, 11) <= sys.version_info[:2] < (3, 13)'
          "$ACE_BASE_PYTHON" tools/prepare_ace_step_runtime.py install

      - name: Required ACE-Step CUDA music-generation acceptance
        if: success()
        run: |
          set -euo pipefail
          "$OEC_PYTHON" tools/run_media_model_smokes.py --providers ace-step --require-pass

      - name: Recheck model cache after downloads
        if: always()
        run: |
          set +e
          if [[ -n "${OEC_PYTHON:-}" ]]; then
            "$OEC_PYTHON" tools/model_cache_manager.py status
          else
            echo "OEC_PYTHON was not selected; cache status unavailable."
          fi
          exit 0

      - name: Final StorageManager status and latest logs
        if: always()
        run: |
          set +e
          if [[ -n "${OEC_PYTHON:-}" ]]; then
            "$OEC_PYTHON" tools/prepare_media_models.py status
          else
            echo "No valid OEC Python selected; direct status command was not run."
          fi
          exit 0
