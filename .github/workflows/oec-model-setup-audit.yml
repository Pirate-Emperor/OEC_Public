name: OEC A100 read-only model setup audit
run-name: "OEC model setup audit - ${{ github.ref_name }}"

on:
  push:
    branches:
      - fix/media-stack-supervision-20261019
    paths:
      - ".github/workflows/oec-model-setup-audit.yml"
      - "tools/prepare_media_models.py"
      - "tools/prepare_ace_step_runtime.py"
      - "tools/storage_reserve_probe.py"
      - "tools/media_services/model_cache.py"
      - "tools/model_cache_manager.py"
      - "core_config.py"
      - "storage_manager.py"
      - "storage_policy.py"
      - "storage_config.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oec-media-gpu-storage-serial
  cancel-in-progress: false

jobs:
  read-only-model-setup-audit:
    name: StorageManager + cache + env audit + aggregate preflight
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-1]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout feature branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm assigned runner and existing Python environment
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-unknown}" = "oec-1" || {
            echo "::error::Expected assigned oec-1 A100 runner; no setup attempted."
            exit 2
          }
          if [[ -f "$HOME/Conda/bin/activate" ]]; then
            source "$HOME/Conda/bin/activate"
          elif [[ -f "$HOME/Conda/etc/profile.d/conda.sh" ]]; then
            source "$HOME/Conda/etc/profile.d/conda.sh"
          fi
          command -v conda >/dev/null 2>&1 || {
            echo "::error::Conda missing; no environment was created or modified."
            exit 2
          }
          test -f "$HOME/OEC/storage_config.json" || {
            echo "::error::Authoritative runner storage_config.json missing; fail closed."
            exit 2
          }
          # Copy the runner's active config into the disposable checkout only.
          install -m 600 "$HOME/OEC/storage_config.json" "$GITHUB_WORKSPACE/storage_config.json"
          selected=""
          for name in oec_deploy phase1 phase1_ltx phase2_3d; do
            py="$(conda run --no-capture-output -n "$name" python -c 'import sys; print(sys.executable)' 2>/dev/null | tail -n 1 || true)"
            if [[ -z "$py" || ! -x "$py" ]]; then continue; fi
            if "$py" -c 'import core_config, huggingface_hub; from storage_manager import storage_preflight, managed_storage_operation' >/dev/null 2>&1; then
              selected="$py"
              echo "SELECTED_ENV=$name"
              echo "OEC_SELECTED_ENV=$name" >> "$GITHUB_ENV"
              break
            fi
          done
          test -n "$selected" || {
            echo "::error::No existing environment has the required OEC + Hugging Face imports; no install attempted."
            exit 2
          }
          echo "OEC_PYTHON=$selected" >> "$GITHUB_ENV"
          echo "RUNNER_HOST=$(hostname)"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "OEC_PYTHON=$selected"
          "$selected" --version
          # Inventory only: no attempt to unload, signal, or terminate other processes.
          nvidia-smi
          nvidia-smi --query-gpu=index,name,memory.total,memory.used,utilization.gpu --format=csv
          nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_gpu_memory --format=csv

      - name: Compile model preparation tools without installing or downloading anything
        run: |
          set -euo pipefail
          "$OEC_PYTHON" -m py_compile             tools/prepare_media_models.py             tools/prepare_ace_step_runtime.py             tools/prepare_media_runtime.py             tools/storage_reserve_probe.py             tools/model_cache_manager.py             tools/media_services/model_cache.py             storage_manager.py storage_policy.py

      - name: Run read-only status, environment audit, and strict aggregate preflight
        id: audit
        env:
          OEC_MODEL_AUDIT_DIR: ${{ runner.temp }}/oec-model-setup-audit-${{ github.run_id }}
        run: |
          set -uo pipefail
          mkdir -p "$OEC_MODEL_AUDIT_DIR"
          printf '{"run_id":"%s","runner":"%s","host":"%s","branch":"%s","commit":"%s","downloads_attempted":false,"package_installs_attempted":false,"services_started":false,"reserve_mutation_attempted":false}\n'             "$GITHUB_RUN_ID" "$RUNNER_NAME" "$(hostname)" "$GITHUB_REF_NAME" "$GITHUB_SHA" > "$OEC_MODEL_AUDIT_DIR/report.json"
          run_capture() {
            local name="$1"; shift
            echo "AUDIT_COMMAND[$name]=$(printf '%q ' "$@")"
            "$@" >"$OEC_MODEL_AUDIT_DIR/$name.log" 2>&1
            local rc=$?
            printf '%s\n' "$rc" > "$OEC_MODEL_AUDIT_DIR/$name.exit_code"
            echo "AUDIT_RESULT[$name]=$rc"
            tail -n 80 "$OEC_MODEL_AUDIT_DIR/$name.log" || true
          }
          run_capture gpu-before nvidia-smi --query-gpu=index,name,memory.total,memory.used,utilization.gpu --format=csv
          run_capture compute-processes-before nvidia-smi --query-compute-apps=gpu_uuid,pid,process_name,used_gpu_memory --format=csv
          run_capture storage-manager-status "$OEC_PYTHON" storage_manager.py --status
          run_capture model-preparation-status "$OEC_PYTHON" tools/prepare_media_models.py status
          run_capture existing-environment-audit "$OEC_PYTHON" tools/prepare_media_models.py env-audit
          # Inventory relevant package presence only; do not load pipelines or allocate CUDA tensors.
          run_capture selected-runtime-package-inventory "$OEC_PYTHON" -c 'import importlib.util,json,sys; mods=["torch","huggingface_hub","transformers","qwen_vl_utils","diffusers","accelerate","soundfile","whisper","kokoro","qwen_asr","acestep","trimesh","PIL"]; print(json.dumps({"python":sys.version.split()[0],"executable":sys.executable,"packages":{m:bool(importlib.util.find_spec(m)) for m in mods}},sort_keys=True))'
          cat > "$OEC_MODEL_AUDIT_DIR/inventory_conda_envs.py" <<'PY'
          import json, re, subprocess, sys
          from pathlib import Path
          conda = sys.argv[1]
          name_filter = re.compile(r"(oec|phase|qa|vl|audio|ltx|3d|freeze|moe|trellis|flux)", re.I)
          modules = ["torch", "transformers", "qwen_vl_utils", "torchvision", "decord", "av", "PIL", "huggingface_hub", "qwen_asr", "kokoro", "whisper", "soundfile", "acestep", "diffusers", "accelerate", "trimesh"]
          proc = subprocess.run([conda, "env", "list", "--json"], text=True, capture_output=True, timeout=30, check=True)
          envs = json.loads(proc.stdout).get("envs", [])
          rows = []
          for raw in envs:
              prefix = Path(raw); name = prefix.name
              if not name_filter.search(name): continue
              python = prefix / "bin" / "python"
              row = {"name": name, "prefix": str(prefix), "python": str(python), "present": python.is_file()}
              if python.is_file():
                  code = """import importlib.util, importlib.metadata, json, sys
mods = %r
dists = ["torch", "transformers", "qwen-vl-utils", "huggingface-hub", "torchvision", "av"]
versions = {}
for dist in dists:
    try: versions[dist] = importlib.metadata.version(dist)
    except importlib.metadata.PackageNotFoundError: versions[dist] = None
print(json.dumps({"python": sys.version.split()[0], "packages": {m: bool(importlib.util.find_spec(m)) for m in mods}, "versions": versions, "executable": sys.executable}, sort_keys=True))
""" % repr(modules)
                  try:
                      check = subprocess.run([str(python), "-c", code], text=True, capture_output=True, timeout=20, check=False)
                      row.update({"returncode": check.returncode, "report": check.stdout.strip(), "stderr_tail": check.stderr[-1000:] if check.returncode else ""})
                      try:
                          presence = json.loads(check.stdout).get("packages", {})
                      except Exception:
                          presence = {}
                      if presence.get("torch") and presence.get("transformers") and presence.get("qwen_vl_utils"):
                          qwen_probe = "from transformers import Qwen2VLForConditionalGeneration, AutoProcessor; from qwen_vl_utils import process_vision_info; print('QWEN2VL_IMPORT=PASS')"
                          try:
                              qp = subprocess.run([str(python), "-c", qwen_probe], text=True, capture_output=True, timeout=60, check=False)
                              row["qwen2vl_import_probe"] = {"returncode": qp.returncode, "stdout": qp.stdout[-1500:], "stderr_tail": qp.stderr[-1500:] if qp.returncode else ""}
                          except Exception as exc:
                              row["qwen2vl_import_probe"] = {"error": type(exc).__name__ + ": " + str(exc)}
                  except Exception as exc: row["probe_error"] = type(exc).__name__ + ": " + str(exc)
              rows.append(row)
          print(json.dumps({"matched_environment_count": len(rows), "environments": rows, "no_environment_created_or_modified": True}, indent=2, sort_keys=True))
          PY
          run_capture all-conda-env-package-inventory "$OEC_PYTHON" "$OEC_MODEL_AUDIT_DIR/inventory_conda_envs.py" "$HOME/Conda/condabin/conda"
          run_capture model-cache-manager-status "$OEC_PYTHON" tools/model_cache_manager.py status
          cat > "$OEC_MODEL_AUDIT_DIR/probe_qwen_cache.py" <<'PY'
          import json, sys
          from pathlib import Path
          from core_config import SYSTEM_DIRS
          from huggingface_hub import snapshot_download
          repo = "Qwen/Qwen2-VL-7B-Instruct"
          try:
              path = Path(snapshot_download(repo_id=repo, cache_dir=SYSTEM_DIRS["models"], local_files_only=True))
              files = [p.name for p in path.iterdir() if p.is_file()]
              print(json.dumps({"status":"CACHE_READY","repo_id":repo,"snapshot_path":str(path),"file_count":len(files),"has_config":"config.json" in files,"has_safetensors":any(n.endswith(".safetensors") for n in files)}, sort_keys=True))
          except Exception as exc:
              print(json.dumps({"status":"MISSING_OR_INCOMPLETE","repo_id":repo,"error_type":type(exc).__name__,"error":str(exc)[:1200]}, sort_keys=True))
          PY
          run_capture qwen2vl-local-cache-probe env HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 "$OEC_PYTHON" "$OEC_MODEL_AUDIT_DIR/probe_qwen_cache.py"
          # Strict authoritative quota only: intentionally do not pass --use-manager-directory-only.
          run_capture aggregate-model-preflight "$OEC_PYTHON" tools/prepare_media_models.py plan --preflight
          "$OEC_PYTHON" - "$OEC_MODEL_AUDIT_DIR/report.json" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1]).parent
          report_path = pathlib.Path(sys.argv[1])
          report = json.loads(report_path.read_text())
          report["selected_python_env"] = __import__("os").environ.get("OEC_SELECTED_ENV", "unknown")
          checks = {}
          for name in (
              "gpu-before", "compute-processes-before", "storage-manager-status",
              "model-preparation-status", "existing-environment-audit",
              "selected-runtime-package-inventory", "all-conda-env-package-inventory", "model-cache-manager-status", "qwen2vl-local-cache-probe",
              "aggregate-model-preflight",
          ):
              try:
                  checks[name] = int((root / f"{name}.exit_code").read_text().strip())
              except Exception:
                  checks[name] = None
          report["checks"] = checks
          def find_json(log_name, wanted_key):
              text = (root / f"{log_name}.log").read_text(encoding="utf-8", errors="replace")
              decoder = json.JSONDecoder()
              for pos, char in enumerate(text):
                  if char != "{":
                      continue
                  try:
                      value, _ = decoder.raw_decode(text[pos:])
                  except json.JSONDecodeError:
                      continue
                  if isinstance(value, dict) and wanted_key in value:
                      return value
              return None
          plan = find_json("aggregate-model-preflight", "missing_models")
          if plan is None:
              plan = find_json("model-preparation-status", "models_root")
          if plan is not None and "missing_models" in plan:
              missing = plan.get("missing_models", [])
              required = float(plan.get("estimated_remaining_download_gb", 0.0))
              report["model_inventory"] = {
                  "models_root": plan.get("models_root"),
                  "missing_models": missing,
                  "estimated_remaining_download_gb": required,
                  "all_required_checkpoint_groups_cached": len(missing) == 0,
              }
              if not missing:
                  report["download_preflight_status"] = "NOT_REQUIRED_ALL_TARGET_CHECKPOINTS_CACHED"
                  report["storage_download_preflight_performed"] = False
              else:
                  aggregate = find_json("aggregate-model-preflight", "aggregate_preflight_ok")
                  report["download_preflight_status"] = (
                      "PASS" if aggregate and aggregate.get("aggregate_preflight_ok") is True
                      else "BLOCKED_OR_FAILED"
                  )
                  report["storage_download_preflight_performed"] = aggregate is not None
          else:
              report["download_preflight_status"] = "UNKNOWN_PLAN_REPORT_UNPARSEABLE"
              report["storage_download_preflight_performed"] = False
          report["model_download_decision"] = "NOT_AUTHORIZED_IN_THIS_AUDIT"
          report["notes"] = [
              "This workflow is read-only with respect to shared model/cache/output contents.",
              "All required target checkpoint groups being cached means no download admission was needed; do not mislabel this as a positive storage-write preflight.",
              "If any model is missing, the strict aggregate preflight must pass before a separate authorized download operation.",
              "Missing/stale quota telemetry remains fail-closed; filesystem free space is not a substitute.",
          ]
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print("OEC_MODEL_SETUP_AUDIT=" + json.dumps(report, sort_keys=True))
          PY
          # Mark a failed required gate red, after preserving reports for upload.
          for name in storage-manager-status model-preparation-status existing-environment-audit aggregate-model-preflight; do
            rc="$(cat "$OEC_MODEL_AUDIT_DIR/$name.exit_code" 2>/dev/null || echo 99)"
            if [[ "$rc" != "0" ]]; then
              echo "::error::Model setup audit gate $name returned $rc. No download or install was attempted."
              exit 2
            fi
          done

      - name: Upload read-only model setup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oec-model-setup-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/oec-model-setup-audit-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 7
