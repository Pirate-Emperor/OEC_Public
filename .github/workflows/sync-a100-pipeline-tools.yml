name: Sync reviewed OEC pipeline support files to the A100 checkout

on:
  push:
    branches:
      - fix/flux-trellis-pipeline-20261015
    paths:
      - .github/a100-pipeline-tools-sync.trigger

permissions:
  contents: read

jobs:
  sync-pipeline-tools:
    name: Create or safely update the reviewed OEC pipeline tools on oec-1
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-1]
    timeout-minutes: 45
    steps:
      - name: Check out the reviewed source revision
        uses: actions/checkout@v4

      - name: Run QA and TRELLIS notebook regression tests before live synchronization
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          PYTHON="${OEC_PYTHON:-$HOME/Conda/envs/phase2_3d/bin/python}"
          if [ ! -x "$PYTHON" ]; then
            echo "A100_TOOL_SYNC=BLOCKED_PHASE2_3D_TEST_PYTHON_MISSING path=$PYTHON"
            exit 20
          fi
          "$PYTHON" -m py_compile qa_compliance_worker.py tools/qa_checks.py pipeline_flux_image.py
          "$PYTHON" -m unittest discover -s tests -p 'test_qa_checks.py' -v
          "$PYTHON" -m unittest discover -s tests -p 'test_trellis_notebook_static.py' -v
          "$PYTHON" -m unittest discover -s tests -p 'test_flux_image.py' -v
          "$PYTHON" -m unittest discover -s tests -p 'test_storage_write_admission.py' -v

      - name: Back up and synchronize only the pipeline support files
        shell: bash
        run: |
          set -Eeuo pipefail
          printf 'A100_TOOL_SYNC_RUN_ID=%s\n' "$GITHUB_RUN_ID"
          printf 'A100_TOOL_SYNC_SOURCE_SHA=%s\n' "$GITHUB_SHA"
          printf 'A100_TOOL_SYNC_RUNNER=%s\n' "${RUNNER_NAME:-unknown}"
          test "${RUNNER_NAME:-unknown}" = "oec-1" || { echo 'A100_TOOL_SYNC=BLOCKED_WRONG_RUNNER'; exit 21; }

          LIVE_ROOT="${OEC_LIVE_REPO:-$HOME/OEC}"
          test -d "$LIVE_ROOT/.git" || { echo "A100_TOOL_SYNC=BLOCKED_LIVE_REPO_NOT_FOUND path=$LIVE_ROOT"; exit 22; }
          LIVE_ROOT="$(realpath "$LIVE_ROOT")"
          WORKSPACE="$(realpath "$GITHUB_WORKSPACE")"
          test "$LIVE_ROOT" != "$WORKSPACE" || { echo 'A100_TOOL_SYNC=BLOCKED_TARGET_IS_ACTIONS_WORKSPACE'; exit 23; }
          REMOTE="$(git -C "$LIVE_ROOT" remote get-url origin)"
          NORMALIZED_REMOTE="${REMOTE%.git}"
          case "$NORMALIZED_REMOTE" in
            https://github.com/Killer4K-N/OEC|git@github.com:Killer4K-N/OEC|ssh://git@github.com/Killer4K-N/OEC) ;;
            *) echo "A100_TOOL_SYNC=BLOCKED_UNEXPECTED_ORIGIN origin=$REMOTE"; exit 24 ;;
          esac
          test -d "$LIVE_ROOT/tools" || { echo 'A100_TOOL_SYNC=BLOCKED_TOOLS_DIRECTORY_MISSING'; exit 25; }

          printf 'A100_TOOL_SYNC_LIVE_ROOT=%s\n' "$LIVE_ROOT"
          printf 'A100_TOOL_SYNC_LIVE_BRANCH=%s\n' "$(git -C "$LIVE_ROOT" branch --show-current || true)"
          printf 'A100_TOOL_SYNC_LIVE_COMMIT=%s\n' "$(git -C "$LIVE_ROOT" rev-parse HEAD)"
          printf 'A100_TOOL_SYNC_LIVE_DIRTY_PATH_COUNT=%s\n' "$(git -C "$LIVE_ROOT" status --short | wc -l | tr -d ' ')"
          printf 'A100_TOOL_SYNC_TARGET_PATH=%s\n' "$LIVE_ROOT/tools"

          BACKUP_ROOT="${OEC_SYNC_BACKUP_ROOT:-$HOME/.local/state/oec-live-sync-backups}/$GITHUB_RUN_ID"
          umask 077
          mkdir -p "$BACKUP_ROOT"
          # Required snapshot is taken before any notebook/entry-point synchronization.
          python3 - "$LIVE_ROOT" "$BACKUP_ROOT" <<'PY'
          from pathlib import Path
          import hashlib, shutil, sys
          root, backup_root = Path(sys.argv[1]), Path(sys.argv[2])
          source = root / "requirements.txt"
          if not source.is_file():
              print("A100_TOOL_SYNC_REQUIREMENTS_TXT=ABSENT path=" + str(source))
          else:
              destination = backup_root / "requirements.txt"
              destination.parent.mkdir(parents=True, exist_ok=True)
              if destination.exists():
                  raise SystemExit("Refusing to overwrite existing requirements backup: " + str(destination))
              original = source.read_bytes()
              shutil.copy2(source, destination)
              copied = destination.read_bytes()
              if copied != original:
                  raise SystemExit("requirements.txt backup verification failed")
              digest = hashlib.sha256(original).hexdigest()
              print(f"A100_TOOL_SYNC_REQUIREMENTS_TXT_BACKUP=PASS path={destination} bytes={len(original)} sha256={digest}")
          PY

          files=(
            tools/flux_gpu_admission.py
            tools/ltx_worker_config.py
            tools/oec_cluster_services.example.json
            tools/oec_runner_probe.py
            tools/oec_service_manager.py
            tools/qa_checks.py
            tools/trellis2_pipeline.json
            tools/trellis_offline.py
            pipeline_flux_image.py
            pipeline_flux_trellis.py
            pipeline_trellis_3d.py
            pipeline_flux_only.ipynb
            pipeline_trellis_3d.ipynb
            pipeline_trellis_3d_only.ipynb
            worker_ltx_video.py
            qa_compliance_worker.py
            docs/background-pipelines.md
          )
          created=0
          updated=0
          unchanged=0
          conflicts=0
          # User-requested notebook repair is authorized only after a verified backup.
          authorized_notebook_overwrite=(
            pipeline_flux_image.py
            pipeline_flux_only.ipynb
            pipeline_trellis_3d.py
            pipeline_trellis_3d.ipynb
            pipeline_trellis_3d_only.ipynb
          )
          for rel in "${files[@]}"; do
            src="$GITHUB_WORKSPACE/$rel"
            dest="$LIVE_ROOT/$rel"
            test -f "$src" || { echo "A100_TOOL_SYNC=BLOCKED_SOURCE_MISSING file=$rel"; exit 26; }
            if [ -f "$dest" ] && cmp -s "$src" "$dest"; then
              echo "A100_TOOL_SYNC_FILE=UNCHANGED path=$rel sha256=$(sha256sum "$dest" | awk '{print $1}')"
              unchanged=$((unchanged+1))
              continue
            fi
            status="$(git -C "$LIVE_ROOT" status --porcelain -- "$rel" 2>/dev/null || true)"
            if [ -e "$dest" ] && [ -n "$status" ]; then
              case "$rel" in
                pipeline_flux_image.py|pipeline_flux_only.ipynb|pipeline_trellis_3d.py|pipeline_trellis_3d.ipynb|pipeline_trellis_3d_only.ipynb)
                  backup="$BACKUP_ROOT/$rel"
                  mkdir -p "$(dirname "$backup")"
                  cp -p "$dest" "$backup"
                  cmp -s "$dest" "$backup" || { echo "A100_TOOL_SYNC=FAIL_BACKUP_MISMATCH file=$rel"; exit 27; }
                  echo "A100_TOOL_SYNC_BACKUP_VERIFIED=$backup"
                  cp -p "$src" "$dest"
                  cmp -s "$src" "$dest" || { echo "A100_TOOL_SYNC=FAIL_VERIFY_MISMATCH file=$rel"; exit 27; }
                  updated=$((updated+1))
                  echo "A100_TOOL_SYNC_FILE=UPDATED_AFTER_VERIFIED_BACKUP path=$rel sha256=$(sha256sum "$dest" | awk '{print $1}')"
                  continue
                  ;;
                *)
                  echo "A100_TOOL_SYNC_FILE=CONFLICT_PRESERVED path=$rel git_status=$(printf '%s' "$status" | tr '\n' ' ')"
                  conflicts=$((conflicts+1))
                  continue
                  ;;
              esac
            fi
            mkdir -p "$(dirname "$dest")"
            if [ -e "$dest" ]; then
              backup="$BACKUP_ROOT/$rel"
              mkdir -p "$(dirname "$backup")"
              cp -p "$dest" "$backup"
              cmp -s "$dest" "$backup" || { echo "A100_TOOL_SYNC=FAIL_BACKUP_MISMATCH file=$rel"; exit 27; }
              echo "A100_TOOL_SYNC_BACKUP_VERIFIED=$backup"
              cp -p "$src" "$dest"
              updated=$((updated+1))
              outcome=UPDATED
            else
              cp -p "$src" "$dest"
              created=$((created+1))
              outcome=CREATED
            fi
            cmp -s "$src" "$dest" || { echo "A100_TOOL_SYNC=FAIL_VERIFY_MISMATCH file=$rel"; exit 27; }
            echo "A100_TOOL_SYNC_FILE=$outcome path=$rel sha256=$(sha256sum "$dest" | awk '{print $1}')"
          done

          python3 - "$LIVE_ROOT" <<'PY'
          import ast, json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          python_files = [
              'tools/flux_gpu_admission.py', 'tools/ltx_worker_config.py',
              'tools/oec_runner_probe.py', 'tools/oec_service_manager.py',
              'tools/qa_checks.py', 'tools/trellis_offline.py', 'pipeline_flux_image.py',
              'pipeline_flux_trellis.py', 'pipeline_trellis_3d.py',
              'worker_ltx_video.py', 'qa_compliance_worker.py',
          ]
          for relative in python_files:
              ast.parse((root / relative).read_text(encoding='utf-8'), filename=relative)
          for relative in ['tools/oec_cluster_services.example.json', 'tools/trellis2_pipeline.json']:
              json.loads((root / relative).read_text(encoding='utf-8'))
          notebooks = ['pipeline_flux_only.ipynb', 'pipeline_trellis_3d.ipynb', 'pipeline_trellis_3d_only.ipynb']
          for relative in notebooks:
              json.loads((root / relative).read_text(encoding='utf-8'))
          print('A100_TOOL_SYNC_STATIC_VALIDATION=PASS python_files=10 json_files=2 notebooks=3')
          PY
          python3 "$LIVE_ROOT/tools/oec_service_manager.py" --help >/dev/null
          echo 'A100_TOOL_SYNC_SERVICE_MANAGER_HELP=PASS'
          printf 'A100_TOOL_SYNC_SUMMARY created=%s updated=%s unchanged=%s conflicts_preserved=%s backup_root=%s\n' "$created" "$updated" "$unchanged" "$conflicts" "$BACKUP_ROOT"
          if [ "$conflicts" -gt 0 ]; then
            echo 'A100_TOOL_SYNC=PASS_WITH_UNRELATED_CONFLICTS_PRESERVED'
          else
            echo 'A100_TOOL_SYNC=PASS'
          fi

      - name: Run live cache-only FLUX Gradio generation smoke on oec-1
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          PYTHONUNBUFFERED: "1"
          AIEROS_FLUX_UI_OUTPUT_MODE: scratch
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "oec-1" || { echo 'FLUX_GRADIO_SMOKE=BLOCKED_WRONG_RUNNER'; exit 31; }
          LIVE_ROOT="${OEC_LIVE_REPO:-$HOME/OEC}"
          LIVE_ROOT="$(realpath "$LIVE_ROOT")"
          PYTHON="${OEC_PYTHON:-$HOME/Conda/envs/phase2_3d/bin/python}"
          test -x "$PYTHON" || { echo "FLUX_GRADIO_SMOKE=BLOCKED_PHASE2_3D_PYTHON_MISSING path=$PYTHON"; exit 32; }
          export AIEROS_FLUX_GRADIO_PORT=17864
          export AIEROS_FLUX_UI_SCRATCH_DIR="/tmp/oec-flux-gradio-smoke-$GITHUB_RUN_ID"
          test ! -e "$AIEROS_FLUX_UI_SCRATCH_DIR" || { echo "FLUX_GRADIO_SMOKE=BLOCKED_OUTPUT_DIR_EXISTS path=$AIEROS_FLUX_UI_SCRATCH_DIR"; exit 33; }
          exec 9>/tmp/oec-flux-inference.lock
          if ! flock -x -w 180 9; then
            echo 'FLUX_GRADIO_SMOKE=BLOCKED_GPU_LOCK_TIMEOUT'
            exit 34
          fi
          GPU="$("$PYTHON" "$LIVE_ROOT/tools/flux_gpu_admission.py" --print-index-only --wait-seconds 180)"
          export AIEROS_GPU="$GPU"
          export CUDA_VISIBLE_DEVICES="$GPU"
          echo "FLUX_GRADIO_SMOKE=START runner=$RUNNER_NAME host=$(hostname) gpu=$GPU port=$AIEROS_FLUX_GRADIO_PORT"
          cd "$LIVE_ROOT"
          "$PYTHON" -u - <<'PY'
          import json
          import os
          import shutil
          import time
          import urllib.request
          from pathlib import Path

          from pipeline_flux_image import check_runtime, create_gradio_demo, load_flux_pipeline, validate_png_file, _system_dirs

          port = int(os.environ["AIEROS_FLUX_GRADIO_PORT"])
          scratch = Path(os.environ["AIEROS_FLUX_UI_SCRATCH_DIR"])
          runtime = check_runtime(gpu=os.environ["AIEROS_GPU"])
          dirs = _system_dirs()
          pipe = load_flux_pipeline(
              model_id="black-forest-labs/FLUX.2-klein-4B",
              model_cache=dirs["models"],
              offline=True,
              gpu=os.environ["AIEROS_GPU"],
          )
          demo = create_gradio_demo(
              pipe,
              output_dir=Path(dirs["outputs"]) / "images",
              port=port,
              scratch_output=True,
              model_cache=dirs["models"],
          )
          try:
              demo.launch(
                  server_name="127.0.0.1",
                  server_port=port,
                  inline=False,
                  share=False,
                  show_error=True,
                  prevent_thread_lock=True,
              )
              root = f"http://127.0.0.1:{port}"
              last_error = None
              for _ in range(60):
                  try:
                      with urllib.request.urlopen(root + "/", timeout=3) as response:
                          if response.status == 200:
                              break
                  except Exception as exc:
                      last_error = exc
                      time.sleep(1)
              else:
                  raise RuntimeError(f"Gradio root did not become healthy: {last_error!r}")
              print(f"FLUX_GRADIO_HTTP=PASS url={root}/", flush=True)

              from gradio_client import Client
              client = Client(root, verbose=True)
              result = client.predict(
                  "A small red ceramic teapot on a clean studio table, soft window light, commercial product photography",
                  None, 512, 512, 4, 1.0, 2048, False,
                  api_name="/generate",
              )
              print("FLUX_GRADIO_PREDICT=PASS response_types=" + json.dumps([type(x).__name__ for x in result]), flush=True)

              pngs = sorted(scratch.glob("flux2_klein_*.png"), key=lambda p: p.stat().st_mtime)
              if not pngs:
                  raise RuntimeError(f"No generated PNG appeared under {scratch}")
              png = pngs[-1]
              meta_path = png.with_name(png.stem + "_info.json")
              validation = validate_png_file(png)
              if not meta_path.is_file():
                  raise RuntimeError(f"Generation metadata is missing: {meta_path}")
              meta = json.loads(meta_path.read_text(encoding="utf-8"))
              assert (meta["width"], meta["height"]) == (512, 512), meta
              assert meta["seed"] == 2048, meta
              assert meta["output_mode"] == "local_scratch_only", meta
              artifact_dir = Path(os.environ["GITHUB_WORKSPACE"]) / "oec-flux-gradio-smoke"
              artifact_dir.mkdir(parents=True, exist_ok=False)
              shutil.copy2(png, artifact_dir / "flux2_klein.png")
              shutil.copy2(meta_path, artifact_dir / "flux2_klein_info.json")
              report = {
                  "status": "PASS",
                  "runner": os.environ.get("RUNNER_NAME"),
                  "host": os.uname().nodename,
                  "gpu": os.environ["AIEROS_GPU"],
                  "port": port,
                  "gradio_http": 200,
                  "gradio_predict": "PASS",
                  "png": str(png),
                  "png_bytes": validation["bytes"],
                  "metadata": str(meta_path),
                  "generation_seconds": meta["generation_seconds"],
                  "runtime": runtime,
              }
              report_path = Path(os.environ["GITHUB_WORKSPACE"]) / "oec-flux-gradio-smoke.json"
              report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print("FLUX_GRADIO_SMOKE=PASS " + json.dumps(report, sort_keys=True), flush=True)
          finally:
              try:
                  demo.close()
              except Exception as close_error:
                  print(f"FLUX_GRADIO_CLOSE_WARNING={type(close_error).__name__}: {close_error}", flush=True)
              del pipe
          PY

      - name: Upload exact-run FLUX Gradio smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oec-flux-gradio-smoke
          path: |
            oec-flux-gradio-smoke.json
            oec-flux-gradio-smoke/**
          if-no-files-found: warn
          retention-days: 30
