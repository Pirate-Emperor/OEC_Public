name: OEC encrypted Hugging Face verifier unit tests

on:
  push:
    branches:
      - main
      - fix/media-stack-supervision-20261019
    paths:
      - "tools/verify_hf_encrypted_asset.py"
      - "tests/test_verify_hf_encrypted_asset.py"
      - ".github/workflows/oec-encrypted-hf-verification-tests.yml"
  pull_request:
    paths:
      - "tools/verify_hf_encrypted_asset.py"
      - "tests/test_verify_hf_encrypted_asset.py"
      - ".github/workflows/oec-encrypted-hf-verification-tests.yml"

permissions:
  contents: read

jobs:
  verifier-tests:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile verifier and run offline unit tests
        run: |
          set -euo pipefail
          python -m py_compile tools/verify_hf_encrypted_asset.py tests/test_verify_hf_encrypted_asset.py
          python -m unittest discover -s tests -p 'test_verify_hf_encrypted_asset.py' -v
