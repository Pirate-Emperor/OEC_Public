name: OEC Git identity and account preflight

on:
  push:
    branches:
      - fix/storage-lock-recovery-git-account-20261111
    paths:
      - ".github/workflows/oec-storage-lock-recovery-preflight.yml"
      - "tools/git_account_switch.py"
      - "tests/test_git_account_switch.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-oec-runner:
    name: Inspect OEC Git identity on ${{ matrix.runner_label }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner_label: [oec-1, oec-2]
    runs-on: [self-hosted, "${{ matrix.runner_label }}"]
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the exact helper version being tested
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm runner, A100 and persistent OEC checkout
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "${{ matrix.runner_label }}"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          nvidia-smi -L | grep -q "A100"
          test -d "$HOME/OEC/.git"
          REPORT="$RUNNER_TEMP/oec-git-account-${{ matrix.runner_label }}.txt"
          {
            echo "RUNNER_NAME=$RUNNER_NAME"
            echo "HOST=$(hostname -f 2>/dev/null || hostname)"
            echo "TIME=$(date -Is)"
            echo "OEC_ROOT=$(git -C "$HOME/OEC" rev-parse --show-toplevel)"
            echo "OEC_HEAD=$(git -C "$HOME/OEC" rev-parse HEAD)"
            echo "OEC_BRANCH=$(git -C "$HOME/OEC" branch --show-current)"
            echo "LAST_COMMIT=$(git -C "$HOME/OEC" log -1 --format='%h %an <%ae> | %cn <%ce>')"
            echo
            echo "=== Git commit identity ==="
            for KEY in user.name user.email; do
              echo "-- effective $KEY --"
              git -C "$HOME/OEC" config --show-origin --get "$KEY" || echo "(unset)"
              echo "-- global $KEY --"
              git -C "$HOME/OEC" config --global --show-origin --get "$KEY" || echo "(unset)"
            done
            echo
            echo "=== Authentication mechanism (metadata only; no credentials printed) ==="
            echo "GitHub CLI:"
            if command -v gh >/dev/null 2>&1; then gh auth status --hostname github.com 2>&1 || true; else echo "not installed"; fi
            echo "Credential helpers:"
            git -C "$HOME/OEC" config --show-origin --get-all credential.helper || echo "(none configured)"
            for FILE in "$HOME/.git-credentials" "$HOME/.config/gh/hosts.yml" "$HOME/.netrc" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"; do
              if test -f "$FILE"; then echo "PRESENT $FILE"; else echo "ABSENT $FILE"; fi
            done
            if command -v ssh-add >/dev/null 2>&1; then
              echo "SSH agent identities:"
              ssh-add -l 2>&1 || true
            else
              echo "ssh-add: unavailable"
            fi
            echo
            echo "=== Remote URL (credentials stripped) ==="
            python3 - "$HOME/OEC" <<'PY'
          import subprocess, sys
          from urllib.parse import urlsplit, urlunsplit
          repo=sys.argv[1]
          p=subprocess.run(["git","-C",repo,"remote","get-url","origin"],capture_output=True,text=True)
          if p.returncode:
              print("(origin unavailable)")
          else:
              raw=p.stdout.strip()
              if "://" in raw:
                  u=urlsplit(raw)
                  print(urlunsplit((u.scheme,u.netloc.rsplit("@",1)[-1],u.path,"","")))
              elif "@" in raw and ":" in raw:
                  print(raw.split("@",1)[-1])
              else:
                  print(raw)
          PY
            echo
            echo "=== Existing local account access test (read-only; no prompts) ==="
            set +e
            timeout 20s env GIT_TERMINAL_PROMPT=0 GCM_INTERACTIVE=Never git -C "$HOME/OEC" ls-remote origin HEAD >/dev/null 2>"$RUNNER_TEMP/oec-git-auth-test.err"
            AUTH_RC=$?
            set -e
            echo "GIT_LS_REMOTE_EXIT=$AUTH_RC"
            if test "$AUTH_RC" -eq 0; then echo "LOCAL_ORIGIN_ACCESS=PASS"; else echo "LOCAL_ORIGIN_ACCESS=FAIL_OR_NO_NONINTERACTIVE_CREDENTIAL"; tail -n 8 "$RUNNER_TEMP/oec-git-auth-test.err"; fi
            echo
            echo "=== Persistent checkout worktree state ==="
            git -C "$HOME/OEC" status --short --untracked-files=no
            echo
            echo "No Git config, remote, credential file or checkout state was modified."
          } | tee "$REPORT"

      - name: Verify safe account-switch helper
        run: |
          set -euo pipefail
          python3 -m py_compile "$GITHUB_WORKSPACE/tools/git_account_switch.py" "$GITHUB_WORKSPACE/tests/test_git_account_switch.py"
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test_git_account_switch.py' -v

      - name: Install account-switch helper into the shared A100 OEC checkout once
        if: matrix.runner_label == 'oec-1'
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "oec-1"
          SRC="$GITHUB_WORKSPACE/tools"
          DST="$HOME/OEC/tools"
          test -d "$DST"
          for FILE in git_account_switch.py git-credential-gh-account.sh; do
            if test -e "$DST/$FILE"; then
              if cmp -s "$SRC/$FILE" "$DST/$FILE"; then
                echo "UNCHANGED: $DST/$FILE already matches tested source"
              else
                echo "CONFLICT: refusing to overwrite existing $DST/$FILE" >&2
                exit 73
              fi
            else
              TEMP="$DST/.${FILE}.install.$"
              install -m 0644 "$SRC/$FILE" "$TEMP"
              mv "$TEMP" "$DST/$FILE"
              echo "INSTALLED: $DST/$FILE"
            fi
          done
          echo "=== Preserved existing OEC worktree changes ==="
          git -C "$HOME/OEC" status --short --untracked-files=all -- storage_config.json tools/git_account_switch.py tools/git-credential-gh-account.sh
          echo "No existing file was overwritten; no Git identity, remote, credential or user worktree change was made."

      - name: Upload runner identity report
        uses: actions/upload-artifact@v4
        with:
          name: oec-git-account-preflight-${{ matrix.runner_label }}
          path: ${{ runner.temp }}/oec-git-account-${{ matrix.runner_label }}.txt
          if-no-files-found: error
          retention-days: 14
