name: OEC ordered live acceptance suite
run-name: "OEC live acceptance suite - ${{ github.ref_name }}"

on:
  # Manual only: a full live run previously exceeded the 30-minute operator limit.
  # Source pushes reconcile the canonical checkout; they must not launch inference automatically.
  workflow_dispatch:

permissions:
  contents: read

# One workflow owns the GPU/storage lane; ordered jobs cannot cancel each other as pending workflows.
concurrency:
  group: oec-media-gpu-storage-serial
  cancel-in-progress: false

jobs:
  sync-source:
    name: Sync current source safely to oec-2
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-2]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require oec-2 and non-destructive source synchronization
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "oec-2"
          test -x "$HOME/Conda/condabin/conda"
          test -f "$HOME/OEC/storage_config.json"
          install -m 600 "$HOME/OEC/storage_config.json" "$GITHUB_WORKSPACE/storage_config.json"
          bash tools/reconcile_a100_oec_root.sh
          selected="$HOME/OEC"
          expected="$(git rev-parse HEAD)"
          actual="$(git -C "$selected" rev-parse HEAD)"
          test "$actual" = "$expected"
          test -z "$(git -C "$selected" status --porcelain --untracked-files=all)"
          printf 'OEC_LIVE_SOURCE_SYNC=PASS\n'
          printf 'OEC_LIVE_SOURCE_PATH=%s\n' "$selected"
          printf 'OEC_LIVE_EXPECTED_SHA=%s\n' "$expected"
          printf 'OEC_LIVE_ACTUAL_SHA=%s\n' "$actual"

  recover-storage-locks:
    name: Authorized legacy storage-lock recovery (oec-1 only)
    needs: sync-source
    if: ${{ always() && needs.sync-source.result == 'success' }}
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-1]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run only authorized conservative legacy lock recovery
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "oec-1" || {
            echo "::error::Legacy recovery is permitted only on oec-1."
            exit 2
          }
          test -x "$HOME/Conda/condabin/conda"
          test -f "$HOME/OEC/storage_config.json"
          install -m 600 "$HOME/OEC/storage_config.json" "$GITHUB_WORKSPACE/storage_config.json"
          C="$HOME/Conda/condabin/conda"
          "$C" run --no-capture-output -n oec_deploy python storage_manager.py --status
          "$C" run --no-capture-output -n oec_deploy python storage_manager.py --clean
          # This verifies lock age, dead owner PID, no lease manifest, and unchanged reserve.
          "$C" run --no-capture-output -n oec_deploy python tools/recover_dead_storage_locks.py outputs
          "$C" run --no-capture-output -n oec_deploy python storage_manager.py --status

  prepare-media-services:
    name: Real Kokoro, Whisper, Qwen3-ASR and ACE-Step inference + Gradio callbacks
    needs: [sync-source, recover-storage-locks]
    if: ${{ always() && needs.sync-source.result == 'success' && needs.recover-storage-locks.result == 'success' }}
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-2]
    env:
      OEC_ALLOW_OEC_PLAY_IDLE_GPU_SHARING: "1"
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate runner and live StorageManager config
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "oec-2"
          test -x "$HOME/Conda/condabin/conda"
          test -f "$HOME/OEC/storage_config.json"
          install -m 600 "$HOME/OEC/storage_config.json" "$GITHUB_WORKSPACE/storage_config.json"
          echo "$HOME/Conda/condabin:$PATH" >> "$GITHUB_PATH"
          nvidia-smi
      - name: Select an existing Python for StorageManager
        run: |
          set -euo pipefail
          selected=""
          for name in oec_deploy phase1 phase1_ltx phase2_3d; do
            py="$("$HOME/Conda/condabin/conda" run --no-capture-output -n "$name" python -c 'import sys; print(sys.executable)' 2>/dev/null | tail -n 1 || true)"
            if [[ -n "$py" && -x "$py" ]] && "$py" -c 'import huggingface_hub, core_config; from storage_manager import storage_preflight, managed_storage_operation' >/dev/null 2>&1; then
              selected="$py"; echo "OEC_STORAGE_ENV=$name"; break
            fi
          done
          test -n "$selected" || { echo "::error::No existing StorageManager Python"; exit 2; }
          echo "OEC_PYTHON=$selected" >> "$GITHUB_ENV"
          "$selected" -m py_compile tools/prepare_media_models.py tools/prepare_media_runtime.py tools/prepare_ace_step_runtime.py tools/run_media_model_smokes.py tools/run_gradio_model_notebook_smokes.py tools/check_media_service_readiness.py tools/media_services/common.py tools/media_services/audio_api.py tools/media_services/smoke_client.py tools/oec_service_manager.py
          "$selected" -m unittest discover -s tests -p 'test_media_service_api.py' -v
          "$selected" -m unittest discover -s tests -p 'test_audio_service_validation.py' -v
          "$selected" -m unittest discover -s tests -p 'test_oec_service_manager_media.py' -v
          "$selected" -m unittest discover -s tests -p 'test_ace_step_runtime.py' -v
          "$selected" -m unittest discover -s tests -p 'test_media_service_readiness.py' -v
      - name: Capture storage/cache state and recover only authorized expired locks
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/oec-live-acceptance-$GITHUB_RUN_ID/media-services"
          mkdir -p "$R"
          "$OEC_PYTHON" tools/prepare_media_models.py status 2>&1 | tee "$R/cache-before.log"
          "$OEC_PYTHON" storage_manager.py --status 2>&1 | tee "$R/storage-before.log"
          "$OEC_PYTHON" -c 'from pathlib import Path; from core_config import SYSTEM_DIRS; blocked=[str(Path(SYSTEM_DIRS[a])/n) for a in ("models","outputs") for n in (".storage_pause.lock",".storage_lease.json") if (Path(SYSTEM_DIRS[a])/n).exists() or (Path(SYSTEM_DIRS[a])/n).is_symlink()]; print("STORAGE_LOCK_GUARD=" + ("BLOCKED " + ",".join(blocked) if blocked else "PASS no lock/lease files")); raise SystemExit(3 if blocked else 0)'
          "$OEC_PYTHON" storage_manager.py --status 2>&1 | tee "$R/storage-after-authorized-recovery.log"
          "$OEC_PYTHON" tools/check_media_service_readiness.py --json 2>&1 | tee "$R/readiness-before.json"
      - name: Download only missing speech checkpoints through StorageManager admission
        run: |
          set -euo pipefail
          for model in kokoro whisper-turbo qwen3-asr-0.6b; do
            echo "MODEL_PREP_START=$model"
            "$OEC_PYTHON" tools/prepare_media_models.py download --model "$model"
            echo "MODEL_PREP_COMPLETE=$model"
          done
      - name: Prepare the isolated speech runtime
        run: |
          set -euo pipefail
          "$OEC_PYTHON" -c 'from storage_manager import storage_preflight; ok, reason = storage_preflight("models", required_gb=1.5, require_fresh_quota=True, minimum_free_gb=2.0); print("AUDIO_RUNTIME_STORAGE_ADMISSION=" + str(bool(ok)) + " reason=" + str(reason)); raise SystemExit(0 if ok else 2)'
          "$OEC_PYTHON" tools/prepare_media_runtime.py
      - name: Live service and real Kokoro/Whisper/Qwen3-ASR Gradio callbacks
        id: speech_gradio
        continue-on-error: true
        run: |
          set -euo pipefail
          "$OEC_PYTHON" tools/run_media_model_smokes.py --providers kokoro,whisper,qwen3-asr --check-gradio-notebooks --require-pass 2>&1 | tee "$RUNNER_TEMP/oec-live-acceptance-$GITHUB_RUN_ID/media-services/speech-gradio-smoke.log"
      - name: Download missing ACE-Step checkpoint groups through StorageManager
        id: ace_step_download
        run: |
          set -euo pipefail
          "$OEC_PYTHON" tools/prepare_media_models.py download --model ace-step-main
          "$OEC_PYTHON" tools/prepare_media_models.py download --model ace-step-lm-0.6b
      - name: Install pinned ACE-Step into its isolated Python environment
        id: ace_step_install
        run: |
          set -euo pipefail
          ACE_BASE_PYTHON=""
          for candidate in "$HOME/Conda/envs/oec_deploy/bin/python" "$HOME/Conda/envs/phase1_ltx/bin/python" "$HOME/Conda/envs/phase2_3d/bin/python" "$HOME/Conda/envs/phase1/bin/python"; do
            [[ -x "$candidate" ]] || continue
            version="$("$candidate" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")' 2>/dev/null || true)"
            case "$version" in 3.11|3.12) ACE_BASE_PYTHON="$candidate"; break;; esac
          done
          test -n "$ACE_BASE_PYTHON" || { echo "::error::No existing Python 3.11/3.12 runtime for isolated ACE-Step"; exit 2; }
          R="$RUNNER_TEMP/oec-live-acceptance-$GITHUB_RUN_ID/media-services"
          mkdir -p "$R"
          "$ACE_BASE_PYTHON" tools/prepare_ace_step_runtime.py ensure 2>&1 | tee "$R/ace-step-runtime-ensure.log"
      - name: Live ACE-Step generation and Gradio notebook callback
        id: ace_step_live
        run: |
          set -euo pipefail
          "$OEC_PYTHON" tools/run_media_model_smokes.py --providers ace-step --check-gradio-notebooks --require-pass 2>&1 | tee "$RUNNER_TEMP/oec-live-acceptance-$GITHUB_RUN_ID/media-services/ace-step-gradio-smoke.log"
      - name: Enforce independent speech and ACE-Step acceptance
        if: always()
        env:
          SPEECH_OUTCOME: ${{ steps.speech_gradio.outcome }}
          ACE_DOWNLOAD_OUTCOME: ${{ steps.ace_step_download.outcome }}
          ACE_INSTALL_OUTCOME: ${{ steps.ace_step_install.outcome }}
          ACE_LIVE_OUTCOME: ${{ steps.ace_step_live.outcome }}
        run: |
          set -u
          echo "SPEECH_ACCEPTANCE_OUTCOME=$SPEECH_OUTCOME"
          echo "ACE_STEP_DOWNLOAD_OUTCOME=$ACE_DOWNLOAD_OUTCOME"
          echo "ACE_STEP_INSTALL_OUTCOME=$ACE_INSTALL_OUTCOME"
          echo "ACE_STEP_LIVE_OUTCOME=$ACE_LIVE_OUTCOME"
          if [[ "$SPEECH_OUTCOME" != "success" || "$ACE_DOWNLOAD_OUTCOME" != "success" || "$ACE_INSTALL_OUTCOME" != "success" || "$ACE_LIVE_OUTCOME" != "success" ]]; then
            echo "::error::At least one speech or ACE-Step acceptance stage did not pass; see per-stage evidence above."
            exit 1
          fi

      - name: Final StorageManager status
        if: always()
        run: |
          set +e
          if [[ -n "$OEC_PYTHON" ]]; then "$OEC_PYTHON" storage_manager.py --status 2>&1 | tee "$RUNNER_TEMP/oec-live-acceptance-$GITHUB_RUN_ID/media-services/storage-final.log"; fi
          if [[ -n "$OEC_PYTHON" ]]; then "$OEC_PYTHON" tools/check_media_service_readiness.py --json 2>&1 | tee "$RUNNER_TEMP/oec-live-acceptance-$GITHUB_RUN_ID/media-services/readiness-after.json"; fi
      - name: Upload API/UI live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oec-live-media-services-${{ github.run_id }}
          path: ${{ runner.temp }}/oec-live-acceptance-${{ github.run_id }}/media-services/
          if-no-files-found: warn
          retention-days: 7

  audiogen-notebook:
    name: AudioGen actual inference and Gradio callback
    needs: [prepare-media-services, sync-source, recover-storage-locks]
    if: ${{ always() && needs.sync-source.result == 'success' && needs.recover-storage-locks.result == 'success' }}
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-2]
    env:
      OEC_ALLOW_OEC_PLAY_IDLE_GPU_SHARING: "1"
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate runner/config and AudioCraft environment
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "oec-2"
          test -x "$HOME/Conda/condabin/conda"
          test -f "$HOME/OEC/storage_config.json"
          install -m 600 "$HOME/OEC/storage_config.json" "$GITHUB_WORKSPACE/storage_config.json"
          "$HOME/Conda/condabin/conda" run --no-capture-output -n phase1 python -c 'import torch, audiocraft; print("TORCH="+torch.__version__); print("CUDA="+str(torch.version.cuda)); assert torch.cuda.is_available()'
          "$HOME/Conda/condabin/conda" run --no-capture-output -n phase1 python -m unittest discover -s tests -p 'test_audiocraft_notebook_static.py' -v
          "$HOME/Conda/condabin/conda" run --no-capture-output -n phase1 python storage_manager.py --status
      - name: Execute existing AudioGen notebook smoke
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/oec-live-acceptance-$GITHUB_RUN_ID/audiogen"
          mkdir -p "$R"
          export OEC_AUDIOGEN_SMOKE_DIR="$R"
          export OEC_AUDIOGEN_HEADLESS_SMOKE=1
          timeout 1200s "$HOME/Conda/condabin/conda" run --no-capture-output -n phase1 python tools/run_audiogen_notebook_smoke.py 2>&1 | tee "$R/existing-notebook.log"
      - name: Launch dedicated AudioGen Gradio and invoke real generation callback
        run: |
          set -euo pipefail
          export OEC_GRADIO_HEADLESS_SMOKE=1
          timeout 1200s "$HOME/Conda/condabin/conda" run --no-capture-output -n phase1 python tools/run_gradio_model_notebook_smokes.py --provider audiogen --report-dir "$RUNNER_TEMP/oec-live-acceptance-$GITHUB_RUN_ID/audiogen" 2>&1 | tee "$RUNNER_TEMP/oec-live-acceptance-$GITHUB_RUN_ID/audiogen/gradio-callback.log"
      - name: Upload AudioGen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oec-live-audiogen-${{ github.run_id }}
          path: ${{ runner.temp }}/oec-live-acceptance-${{ github.run_id }}/audiogen/
          if-no-files-found: warn
          retention-days: 7

  musicgen-notebook:
    name: MusicGen actual inference and Gradio callback
    needs: [audiogen-notebook, sync-source, recover-storage-locks]
    if: ${{ always() && needs.sync-source.result == 'success' && needs.recover-storage-locks.result == 'success' }}
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-2]
    env:
      OEC_ALLOW_OEC_PLAY_IDLE_GPU_SHARING: "1"
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate runner/config and MusicGen environment
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "oec-2"
          test -x "$HOME/Conda/condabin/conda"
          test -f "$HOME/OEC/storage_config.json"
          install -m 600 "$HOME/OEC/storage_config.json" "$GITHUB_WORKSPACE/storage_config.json"
          "$HOME/Conda/condabin/conda" run --no-capture-output -n phase1 python -c 'import torch, torchaudio, audiocraft, soundfile; assert torch.cuda.is_available(); print("TORCH="+torch.__version__); print("AUDIOCRAFT="+__import__("importlib.metadata",fromlist=["version"]).version("audiocraft"))'
          "$HOME/Conda/condabin/conda" run --no-capture-output -n phase1 python -m unittest discover -s tests -p 'test_musicgen_pipeline.py' -v
          "$HOME/Conda/condabin/conda" run --no-capture-output -n phase1 python storage_manager.py --status
      - name: Generate real MusicGen WAV with quota-admitted cache fill if needed
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/oec-live-acceptance-$GITHUB_RUN_ID/musicgen"
          mkdir -p "$R"
          OUT="/tmp/oec-musicgen-suite-$GITHUB_RUN_ID.wav"
          "$HOME/Conda/condabin/conda" run --no-capture-output -n phase1 python pipeline_musicgen.py --mode generate --allow-download --scratch-output --output "$OUT" --duration 3 --seed 42 --prompt "A short gentle instrumental cue with warm piano and mellow strings" 2>&1 | tee "$R/model-generation.log"
          cp "$OUT" "$R/"
          cp "${OUT%.wav}.info.json" "$R/"
          "$HOME/Conda/condabin/conda" run --no-capture-output -n phase1 python -c 'import soundfile,sys; info=soundfile.info(sys.argv[1]); print("MUSICGEN_WAV_VALIDATION=PASS", info); assert info.frames>0 and info.samplerate>0' "$R/$(basename "$OUT")"
      - name: Launch MusicGen Gradio and invoke real generation callback
        run: |
          set -euo pipefail
          export OEC_GRADIO_HEADLESS_SMOKE=1
          timeout 1200s "$HOME/Conda/condabin/conda" run --no-capture-output -n phase1 python tools/run_gradio_model_notebook_smokes.py --provider musicgen --report-dir "$RUNNER_TEMP/oec-live-acceptance-$GITHUB_RUN_ID/musicgen" 2>&1 | tee "$RUNNER_TEMP/oec-live-acceptance-$GITHUB_RUN_ID/musicgen/gradio-callback.log"
      - name: Final MusicGen storage status
        if: always()
        run: |
          set +e
          "$HOME/Conda/condabin/conda" run --no-capture-output -n phase1 python storage_manager.py --status 2>&1 | tee "$RUNNER_TEMP/oec-live-acceptance-$GITHUB_RUN_ID/musicgen/storage-final.log"
      - name: Upload MusicGen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oec-live-musicgen-${{ github.run_id }}
          path: ${{ runner.temp }}/oec-live-acceptance-${{ github.run_id }}/musicgen/
          if-no-files-found: warn
          retention-days: 7

  visual-sidecars:
    name: LTX and TRELLIS real sidecar inference
    needs: [musicgen-notebook, sync-source, recover-storage-locks]
    if: ${{ always() && needs.sync-source.result == 'success' && needs.recover-storage-locks.result == 'success' }}
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-2]
    env:
      OEC_ALLOW_OEC_PLAY_IDLE_GPU_SHARING: "1"
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate runner/config and compile visual adapters
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "oec-2"
          test -x "$HOME/Conda/condabin/conda"
          test -f "$HOME/OEC/storage_config.json"
          install -m 600 "$HOME/OEC/storage_config.json" "$GITHUB_WORKSPACE/storage_config.json"
          "$HOME/Conda/condabin/conda" run --no-capture-output -n oec_deploy python -m py_compile tools/run_visual_media_sidecar_smokes.py tools/media_services/common.py tools/media_services/ltx_api.py tools/media_services/trellis_api.py brain.py worker_ltx_video.py qa_compliance_worker.py hf_upload_daemon.py
          "$HOME/Conda/condabin/conda" run --no-capture-output -n oec_deploy python -m unittest discover -s tests -p 'test_brain_ltx_queue_storage.py' -v
          "$HOME/Conda/condabin/conda" run --no-capture-output -n oec_deploy python -m unittest discover -s tests -p 'test_visual_storage_cleanup.py' -v
      - name: Storage preflight and cache-only LTX/TRELLIS acceptance
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/oec-live-acceptance-$GITHUB_RUN_ID/visual"
          mkdir -p "$R"
          "$HOME/Conda/condabin/conda" run --no-capture-output -n oec_deploy python storage_manager.py --status 2>&1 | tee "$R/storage-before.log"
          "$HOME/Conda/condabin/conda" run --no-capture-output -n oec_deploy python -c 'from pathlib import Path; from core_config import SYSTEM_DIRS; blocked=[str(Path(SYSTEM_DIRS[a])/n) for a in ("models","outputs") for n in (".storage_pause.lock",".storage_lease.json") if (Path(SYSTEM_DIRS[a])/n).exists() or (Path(SYSTEM_DIRS[a])/n).is_symlink()]; print("STORAGE_LOCK_GUARD=" + ("BLOCKED " + ",".join(blocked) if blocked else "PASS no lock/lease files")); raise SystemExit(3 if blocked else 0)'
          export OEC_VISUAL_SMOKE_DIR="$R"
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          timeout 6900s "$HOME/Conda/condabin/conda" run --no-capture-output -n oec_deploy python tools/run_visual_media_sidecar_smokes.py 2>&1 | tee "$R/sidecar-run.log"
          "$HOME/Conda/condabin/conda" run --no-capture-output -n oec_deploy python storage_manager.py --status 2>&1 | tee "$R/storage-after.log"
      - name: Upload visual outputs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oec-live-visual-${{ github.run_id }}
          path: ${{ runner.temp }}/oec-live-acceptance-${{ github.run_id }}/visual/
          if-no-files-found: warn
          retention-days: 7

  flux-trellis:
    name: FLUX PNG to TRELLIS GLB actual inference
    needs: [visual-sidecars, sync-source, recover-storage-locks]
    if: ${{ always() && needs.sync-source.result == 'success' && needs.recover-storage-locks.result == 'success' }}
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-2]
    env:
      OEC_ALLOW_OEC_PLAY_IDLE_GPU_SHARING: "1"
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate phase2_3d and run component contracts
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "oec-2"
          test -x "$HOME/Conda/condabin/conda"
          test -f "$HOME/OEC/storage_config.json"
          install -m 600 "$HOME/OEC/storage_config.json" "$GITHUB_WORKSPACE/storage_config.json"
          "$HOME/Conda/condabin/conda" run --no-capture-output -n phase2_3d python -c 'import torch,diffusers,huggingface_hub,transformers; assert torch.cuda.is_available(); print("TORCH="+torch.__version__); print("CUDA="+str(torch.version.cuda))'
          "$HOME/Conda/condabin/conda" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_flux_image_pipeline.py' -v
          "$HOME/Conda/condabin/conda" run --no-capture-output -n phase2_3d python -m unittest discover -s tests -p 'test_flux_trellis_pipeline.py' -v
      - name: Generate and validate PNG then GLB on the same image
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/oec-live-acceptance-$GITHUB_RUN_ID/flux-trellis"
          W="/tmp/oec-flux-live-suite-$GITHUB_RUN_ID"
          mkdir -p "$R"
          "$HOME/Conda/condabin/conda" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-before.log"
          timeout 6600s "$HOME/Conda/condabin/conda" run --no-capture-output -n phase2_3d python tools/run_flux_pipeline_smoke.py --work-dir "$W" --report-dir "$R" --width 512 --height 512 --steps 4 2>&1 | tee "$R/flux-trellis.log"
          "$HOME/Conda/condabin/conda" run --no-capture-output -n phase2_3d python storage_manager.py --status 2>&1 | tee "$R/storage-after.log"
      - name: Upload PNG/GLB and model report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oec-live-flux-trellis-${{ github.run_id }}
          path: ${{ runner.temp }}/oec-live-acceptance-${{ github.run_id }}/flux-trellis/
          if-no-files-found: warn
          retention-days: 7

  qa-hf-e2e:
    name: LTX -> Qwen2-VL QA -> HF resumable upload -> remote hash read-back
    needs: [flux-trellis, sync-source, recover-storage-locks]
    if: ${{ always() && needs.sync-source.result == 'success' && needs.recover-storage-locks.result == 'success' }}
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-2]
    env:
      OEC_ALLOW_OEC_PLAY_IDLE_GPU_SHARING: "1"
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate runner/config and compile end-to-end harness
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "oec-2"
          test -x "$HOME/Conda/condabin/conda"
          test -f "$HOME/OEC/storage_config.json"
          install -m 600 "$HOME/OEC/storage_config.json" "$GITHUB_WORKSPACE/storage_config.json"
          "$HOME/Conda/condabin/conda" run --no-capture-output -n oec_deploy python -m py_compile tools/run_oec_e2e_acceptance.py qa_compliance_worker.py hf_upload_daemon.py tools/run_visual_media_sidecar_smokes.py
          "$HOME/Conda/condabin/conda" run --no-capture-output -n oec_deploy python -m unittest discover -s tests -p 'test_oec_e2e_acceptance_contract.py' -v
          "$HOME/Conda/condabin/conda" run --no-capture-output -n oec_deploy python storage_manager.py --status
      - name: Run the joined Brain/LTX/Qwen2-VL/HF chunk/read-back acceptance
        env:
          OEC_EXPECTED_RUNNER: oec-2
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/oec-live-acceptance-$GITHUB_RUN_ID/e2e"
          mkdir -p "$R"
          export OEC_E2E_REPORT_DIR="$R"
          timeout 10200s "$HOME/Conda/condabin/conda" run --no-capture-output -n oec_deploy python tools/run_oec_e2e_acceptance.py 2>&1 | tee "$R/e2e-run.log"
          "$HOME/Conda/condabin/conda" run --no-capture-output -n oec_deploy python storage_manager.py --status 2>&1 | tee "$R/storage-after.log"
      - name: Upload QA decision, HF manifest/parts, read-back, and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oec-live-qa-hf-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/oec-live-acceptance-${{ github.run_id }}/e2e/
          if-no-files-found: warn
          retention-days: 7
