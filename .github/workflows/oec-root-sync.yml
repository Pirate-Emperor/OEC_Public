name: OEC canonical A100 root synchronization

on:
  push:
    branches:
      - fix/media-stack-supervision-20261019
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# The deadline watchdog must be independent of a canonical sync waiting for the GPU runner.
# The shared checkout itself is serialized on canonical-root-sync below.
jobs:
  enforce-30-minute-cutoff:
    name: Stop stale OEC A100 media runs
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cancel allow-listed same-branch media runs older than 30 minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          this_run = int(os.environ["GITHUB_RUN_ID"])
          token = os.environ["GITHUB_TOKEN"]
          cutoff = datetime.timedelta(minutes=30)
          acceptance_path = ".github/workflows/oec-demo-notebook-acceptance.yml"
          superseded_paths = {
              acceptance_path,
              ".github/workflows/oec-flux-pipeline-smoke.yml",
              ".github/workflows/storage-admission-guard-tests.yml",
          }
          allowed_paths = {
              ".github/workflows/oec-live-acceptance-suite.yml",
              ".github/workflows/oec-model-service-release.yml",
              ".github/workflows/oec-a100-media-model-bootstrap.yml",
              ".github/workflows/oec-flux-pipeline-smoke.yml",
              ".github/workflows/oec-visual-media-sidecar-smoke.yml",
              ".github/workflows/oec-audiogen-notebook-smoke.yml",
              ".github/workflows/oec-musicgen-smoke.yml",
              ".github/workflows/oec-e2e-acceptance.yml",
              ".github/workflows/oec-demo-notebook-acceptance.yml",
              ".github/workflows/storage-admission-guard-tests.yml",
          }
          api = f"https://api.github.com/repos/{repository}/actions/runs"
          query = urllib.parse.urlencode({"branch": branch, "per_page": 100})
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request_json(url, method="GET", *, allow_conflict=False):
              # The self-hosted runner's outbound HTTPS has transient handshake
              # timeouts. Retry with a bounded budget rather than failing the
              # whole source-sync workflow on the first network blip.
              last_error = None
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers=headers,
                          data=b"" if method == "POST" else None,
                          method=method,
                      )
                      with urllib.request.urlopen(request, timeout=12) as response:
                          body = response.read()
                          return response.status, (json.loads(body) if body else {})
                  except urllib.error.HTTPError as exc:
                      if allow_conflict and exc.code == 409:
                          body = exc.read()
                          try:
                              conflict_payload = json.loads(body) if body else {}
                          except (json.JSONDecodeError, UnicodeDecodeError):
                              conflict_payload = {}
                          print(f"OEC_DEADLINE_API_CONFLICT method={method} status=409", flush=True)
                          return exc.code, conflict_payload
                      last_error = exc
                      if attempt < 2:
                          delay = 2 ** attempt
                          print(f"OEC_DEADLINE_API_RETRY attempt={attempt + 1} method={method} delay_seconds={delay} error={type(exc).__name__}", flush=True)
                          time.sleep(delay)
                  except Exception as exc:
                      last_error = exc
                      if attempt < 2:
                          delay = 2 ** attempt
                          print(f"OEC_DEADLINE_API_RETRY attempt={attempt + 1} method={method} delay_seconds={delay} error={type(exc).__name__}", flush=True)
                          time.sleep(delay)
              raise RuntimeError(
                  f"GitHub Actions API request failed after 3 attempts ({method}, {type(last_error).__name__})"
              ) from last_error

          _, payload = request_json(f"{api}?{query}")
          now = datetime.datetime.now(datetime.timezone.utc)
          for run in payload.get("workflow_runs", []):
              run_id = int(run.get("id", 0))
              if run_id == this_run or run.get("head_branch") != branch:
                  continue
              if run.get("path") not in allowed_paths:
                  continue
              if run.get("status") not in {"in_progress", "queued", "pending", "waiting", "requested"}:
                  continue
              started = run.get("run_started_at") or run.get("created_at")
              if not started:
                  continue
              start = datetime.datetime.fromisoformat(started.replace("Z", "+00:00"))
              age = now - start
              # Expensive media/guard runs from older source SHAs are not valid
              # current-head evidence; cancel them as soon as a replacement is pushed.
              superseded_media_run = False
              current_sha = None
              if run.get("path") in superseded_paths:
                  # Compare against the live branch head, not this watchdog run's own SHA.
                  _, branch_state = request_json(
                      f"https://api.github.com/repos/{repository}/branches/{urllib.parse.quote(branch, safe='')}"
                  )
                  current_sha = (branch_state.get("commit") or {}).get("sha")
                  superseded_media_run = bool(
                      current_sha and run.get("head_sha") != current_sha
                  )
              if not superseded_media_run and age <= cutoff:
                  print(f"OEC_DEADLINE_OK run={run_id} age_seconds={int(age.total_seconds())} status={run['status']}")
                  continue
              if superseded_media_run:
                  print(
                      f"OEC_DEADLINE_CANCEL_SUPERSEDED run={run_id} "
                      f"path={run.get('path')} run_sha={run.get('head_sha')} "
                      f"current_sha={current_sha} status={run.get('status')}",
                      flush=True,
                  )
              url = f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/cancel"
              run_url = f"https://api.github.com/repos/{repository}/actions/runs/{run_id}"
              status, _ = request_json(url, method="POST", allow_conflict=True)
              if status == 409:
                  # Cancellation can race a run that has just reached a terminal state.
                  # Re-read the authoritative run before deciding whether this is an error.
                  _, state = request_json(run_url)
                  if state.get("status") not in {"in_progress", "queued", "pending", "waiting", "requested"}:
                      print(f"OEC_DEADLINE_CANCEL_CONFLICT_TERMINAL run={run_id} status={state.get('status')} conclusion={state.get('conclusion')}")
                      continue
                  raise SystemExit(f"Cancel request conflicted for run {run_id}, which remains active; no forced cancellation attempted")
              if status not in (200, 202):
                  raise SystemExit(f"Cancel request failed for run {run_id}: HTTP {status}")
              print(f"OEC_DEADLINE_CANCEL_REQUESTED run={run_id} age_seconds={int(age.total_seconds())} path={run.get('path')} status={run.get('status')}")
              # A stuck runner may acknowledge cancellation without reaching a terminal state.
              # Escalate only for this same-branch, allow-listed run after a short grace period.
              for _ in range(6):
                  time.sleep(2)
                  _, state = request_json(run_url)
                  if state.get("status") not in {"in_progress", "queued", "pending", "waiting", "requested"}:
                      print(f"OEC_DEADLINE_CANCEL_CONFIRMED run={run_id} status={state.get('status')} conclusion={state.get('conclusion')}")
                      break
              else:
                  force_url = f"https://api.github.com/repos/{repository}/actions/runs/{run_id}/force-cancel"
                  force_status, _ = request_json(force_url, method="POST")
                  if force_status not in (200, 202):
                      raise SystemExit(f"Force-cancel failed for run {run_id}: HTTP {force_status}")
                  print(f"OEC_DEADLINE_FORCE_CANCEL_REQUESTED run={run_id} age_seconds={int(age.total_seconds())}")
                  terminal = False
                  for force_attempt in range(6):
                      time.sleep(3)
                      _, state = request_json(run_url)
                      if state.get("status") not in {"in_progress", "queued", "pending", "waiting", "requested"}:
                          print(f"OEC_DEADLINE_FORCE_CANCEL_CONFIRMED run={run_id} status={state.get('status')} conclusion={state.get('conclusion')}")
                          terminal = True
                          break
                      if force_attempt in {1, 3}:
                          retry_status, _ = request_json(force_url, method="POST")
                          if retry_status not in (200, 202):
                              raise SystemExit(f"Repeated force-cancel failed for run {run_id}: HTTP {retry_status}")
                          print(f"OEC_DEADLINE_FORCE_CANCEL_RETRY run={run_id} attempt={force_attempt + 1} status={state.get('status')}")
                  if not terminal:
                      print(f"OEC_DEADLINE_FORCE_CANCEL_NOT_TERMINAL run={run_id} last_status={state.get('status')}")
          PY

  canonical-root-sync:
    name: Sync A100's canonical OEC checkout to GitHub
    needs: enforce-30-minute-cutoff
    if: ${{ needs.enforce-30-minute-cutoff.result == 'success' }}
    concurrency:
      group: oec-canonical-source-reconcile
      # Serialize changes to the persistent canonical checkout; never cancel a live Git operation.
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-2]
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the exact pushed source in an isolated Actions workspace
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconcile persistent root without discarding local work
        env:
          OEC_SYNC_BRANCH: fix/media-stack-supervision-20261019
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "oec-2"
          bash -n tools/reconcile_a100_oec_root.sh tools/sync_feature_branch_a100.sh
          timeout --signal=INT --kill-after=15s 600s bash tools/reconcile_a100_oec_root.sh
