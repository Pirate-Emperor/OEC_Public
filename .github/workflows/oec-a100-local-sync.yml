name: OEC canonical A100 source sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oec-media-gpu-storage-serial
  cancel-in-progress: false

jobs:
  canonical-root-sync:
    name: Reconcile the single canonical checkout
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-2]
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout selected OEC branch in the Actions workspace
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Sync $HOME/OEC to the approved GitHub branch
        env:
          OEC_SYNC_BRANCH: fix/media-stack-supervision-20261019
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "oec-2"
          bash -n tools/reconcile_a100_oec_root.sh tools/sync_feature_branch_a100.sh
          timeout --signal=INT --kill-after=15s 600s bash tools/reconcile_a100_oec_root.sh
