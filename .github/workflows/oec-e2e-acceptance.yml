name: OEC guarded live QA-to-HF end-to-end acceptance
run-name: "OEC E2E acceptance - ${{ github.ref_name }}"

on:
  push:
    branches:
      - fix/media-stack-supervision-20261019
    paths:
      - ".github/workflows/oec-e2e-acceptance.yml"
      - "tools/run_oec_e2e_acceptance.py"
      - "tools/run_visual_media_sidecar_smokes.py"
      - "qa_compliance_worker.py"
      - "hf_upload_daemon.py"
      - "asset_status.py"
      - "core_config.py"
      - "storage_manager.py"
      - "storage_policy.py"
      - "tests/test_oec_e2e_acceptance_contract.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize with all other oec-1 model/storage workflows.
  group: oec-media-gpu-storage-serial
  cancel-in-progress: false

jobs:
  live-qa-upload-e2e:
    name: LTX -> Qwen2-VL QA -> HF chunk upload -> read-after-write
    runs-on: [self-hosted, linux, x64, gpu, a100, oec-1]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      OEC_E2E_REPORT_DIR: ${{ runner.temp }}/oec-e2e-acceptance-${{ github.run_id }}
    steps:
      - name: Checkout feature branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm assigned runner and existing environments
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-unknown}" = "oec-1" || {
            echo "::error::This live pipeline must run on oec-1."
            exit 2
          }
          test -x "$HOME/Conda/condabin/conda"
          "$HOME/Conda/condabin/conda" env list | awk '{print $1}' | grep -qx oec_deploy
          "$HOME/Conda/condabin/conda" env list | awk '{print $1}' | grep -qx phase1_ltx
          "$HOME/Conda/condabin/conda" env list | awk '{print $1}' | grep -qx phase2_3d
          nvidia-smi

      - name: Compile the live acceptance harness
        run: |
          set -euo pipefail
          "$HOME/Conda/condabin/conda" run --no-capture-output -n oec_deploy             python -m py_compile tools/run_oec_e2e_acceptance.py qa_compliance_worker.py             hf_upload_daemon.py tools/run_visual_media_sidecar_smokes.py

      - name: Run guarded live LTX -> QA -> resumable upload -> remote verification
        id: e2e
        run: |
          set -uo pipefail
          set +e
          "$HOME/Conda/condabin/conda" run --no-capture-output -n oec_deploy             python tools/run_oec_e2e_acceptance.py 2>&1 | tee "$RUNNER_TEMP/oec-e2e-acceptance-${{ github.run_id }}.log"
          rc=${PIPESTATUS[0]}
          echo "OEC_E2E_EXIT_CODE=$rc"
          exit "$rc"

      - name: Upload the run report, generated media, QA-passed source and remote read-back evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oec-e2e-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/oec-e2e-acceptance-${{ github.run_id }}/
            ${{ runner.temp }}/oec-e2e-acceptance-${{ github.run_id }}.log
          if-no-files-found: warn
          retention-days: 7
