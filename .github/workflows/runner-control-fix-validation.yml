name: Runner Control Fix Validation
run-name: "runner-control-fix-validation-${{ github.run_id }}"

on:
  push:
    branches:
      - fix/runner-control-stop-status-20261009

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile controller
        run: python -m py_compile tools/runner_control.py
      - name: Run isolated lifecycle/auth regression tests
        run: python -m unittest discover -s tests -p 'test_runner_control_fix.py' -v
      - name: Install upload-daemon import dependency for full-suite tests
        run: python -m pip install --disable-pip-version-check huggingface_hub
      - name: Run complete repository test suite
        run: python -m unittest discover -s tests -v
