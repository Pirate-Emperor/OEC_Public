<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430"><rect width="100%" height="100%" fill="white"/><text x="700" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700">Five-stage generation, interaction and evidence workflow</text><rect x="50" y="135" width="210" height="135" rx="12" fill="white" stroke="#333" stroke-width="2"/><text x="155" y="191.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">1 · Intent &amp; setup</text><text x="155" y="233.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Prompt · settings · schema</text><rect x="330" y="135" width="210" height="135" rx="12" fill="white" stroke="#333" stroke-width="2"/><text x="435" y="191.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">2 · Seed authoring</text><text x="435" y="233.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Gemma · FLUX · safety</text><rect x="610" y="135" width="210" height="135" rx="12" fill="white" stroke="#333" stroke-width="2"/><text x="715" y="191.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">3 · Interactive rollout</text><text x="715" y="233.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Waypoint · frame history</text><rect x="890" y="135" width="210" height="135" rx="12" fill="white" stroke="#333" stroke-width="2"/><text x="995" y="191.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">4 · World interaction</text><text x="995" y="233.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Controls · events · audio</text><rect x="1170" y="135" width="210" height="135" rx="12" fill="white" stroke="#333" stroke-width="2"/><text x="1275" y="191.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">5 · Evidence &amp; delivery</text><text x="1275" y="233.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Artifacts · metadata · QA</text><line x1="260" y1="202" x2="330" y2="202" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><line x1="540" y1="202" x2="610" y2="202" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><line x1="820" y1="202" x2="890" y2="202" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><line x1="1100" y1="202" x2="1170" y2="202" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/><text x="700" y="350" text-anchor="middle" font-family="Arial" font-size="17">Separate seed-image quality, interactive temporal response, world interaction and artifact delivery.</text><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker></defs></svg>