<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830"><rect width="100%" height="100%" fill="white"/><text x="700" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700">Nine evidence dimensions</text><rect x="60" y="115" width="390" height="135" rx="12" fill="white" stroke="#333" stroke-width="2"/><text x="255" y="171.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">M1 · Input and schema</text><text x="255" y="213.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Typed requests · bounded prompts</text><rect x="510" y="115" width="390" height="135" rx="12" fill="white" stroke="#333" stroke-width="2"/><text x="705" y="171.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">M2 · Model readiness</text><text x="705" y="213.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Provider · model · backend</text><rect x="960" y="115" width="390" height="135" rx="12" fill="white" stroke="#333" stroke-width="2"/><text x="1155" y="171.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">M3 · Inference</text><text x="1155" y="213.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Actual model execution</text><rect x="60" y="320" width="390" height="135" rx="12" fill="white" stroke="#333" stroke-width="2"/><text x="255" y="376.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">M4 · Output existence</text><text x="255" y="418.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Non-empty media artifact</text><rect x="510" y="320" width="390" height="135" rx="12" fill="white" stroke="#333" stroke-width="2"/><text x="705" y="376.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">M5 · Format structure</text><text x="705" y="418.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">PNG · WAV · FLAC · MP4 · GLB</text><rect x="960" y="320" width="390" height="135" rx="12" fill="white" stroke="#333" stroke-width="2"/><text x="1155" y="376.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">M6 · Provenance</text><text x="1155" y="418.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Prompt · seed · session metadata</text><rect x="60" y="525" width="390" height="135" rx="12" fill="white" stroke="#333" stroke-width="2"/><text x="255" y="581.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">M7 · Resource governance</text><text x="255" y="623.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">GPU admission · storage · isolation</text><rect x="510" y="525" width="390" height="135" rx="12" fill="white" stroke="#333" stroke-width="2"/><text x="705" y="581.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">M8 · Interactive response</text><text x="705" y="623.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Control · frame · state response</text><rect x="960" y="525" width="390" height="135" rx="12" fill="white" stroke="#333" stroke-width="2"/><text x="1155" y="581.7" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700">M9 · Repeatability</text><text x="1155" y="623.55" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Recording · logs · inspectable evidence</text><text x="700" y="785" text-anchor="middle" font-family="Arial" font-size="16">Verification layers, not a fabricated composite model-quality score.</text></svg>